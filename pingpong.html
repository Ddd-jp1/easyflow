<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EasyFlow — Пинг-понг</title>

<style>

/* =====================================
   ОСНОВНЫЕ СТИЛИ
===================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #111827;
    min-height: 100vh;
}

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 18px 6%;
}

.header {
    max-width: 900px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #2563eb;
    font-size: 27px;
    font-weight: bold;
    text-decoration: none;
}

.back {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}


/* =====================================
   КОНТЕЙНЕР
===================================== */

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 35px 20px;
}


/* =====================================
   ЗАГОЛОВОК
===================================== */

.title {
    text-align: center;
    margin-bottom: 25px;
}

.title h1 {
    font-size: 40px;
    color: #2563eb;
    margin-bottom: 8px;
}

.title p {
    color: #64748b;
}


/* =====================================
   СЛОЖНОСТЬ
===================================== */

.difficulty {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 20px;
    border: 1px solid #e5e7eb;
    text-align: center;
}

.difficulty h2 {
    margin-bottom: 15px;
}

.levels {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.level {
    border: 2px solid #e5e7eb;
    background: white;

    padding: 12px 20px;

    border-radius: 12px;

    cursor: pointer;

    font-weight: bold;

    transition: 0.2s;
}

.level:hover {
    transform: translateY(-2px);
}

.level:active {
    transform: translateY(0);
}

.level.active.easy {
    border-color: #22c55e;
    background: #dcfce7;
    color: #166534;
}

.level.active.medium {
    border-color: #eab308;
    background: #fef9c3;
    color: #854d0e;
}

.level.active.hard {
    border-color: #ef4444;
    background: #fee2e2;
    color: #991b1b;
}


/* =====================================
   СТАТИСТИКА
===================================== */

.info {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.stat {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 14px;

    padding: 14px 25px;

    text-align: center;

    min-width: 130px;
}

.stat span {
    display: block;

    color: #64748b;

    font-size: 14px;

    margin-bottom: 5px;
}

.stat strong {
    font-size: 23px;
}


/* =====================================
   ИГРОВОЕ ПОЛЕ
===================================== */

.game-wrapper {
    width: 100%;

    display: flex;
    justify-content: center;

    position: relative;
}

#game {
    display: block;

    width: min(90vw, 700px);
    height: auto;

    aspect-ratio: 700 / 450;

    background: #111827;

    border: 5px solid #2563eb;

    border-radius: 15px;

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.15);

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;

    cursor: crosshair;
}


/* =====================================
   ПОДСКАЗКА
===================================== */

.touch-hint {
    text-align: center;

    color: #64748b;

    margin-top: 14px;

    font-size: 15px;
}


/* =====================================
   КНОПКИ
===================================== */

.buttons {
    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 20px;
}

.main-button {
    border: none;

    background: #2563eb;

    color: white;

    padding: 13px 22px;

    border-radius: 11px;

    cursor: pointer;

    font-weight: bold;

    font-size: 16px;

    transition: 0.2s;
}

.main-button:hover {
    background: #1d4ed8;
}

.main-button:active {
    transform: scale(0.97);
}

.pause-button {
    background: #64748b;
}

.pause-button:hover {
    background: #475569;
}


/* =====================================
   СООБЩЕНИЕ
===================================== */

.message {
    text-align: center;

    margin-top: 20px;

    min-height: 25px;

    font-weight: bold;
}

.game-over {
    color: #ef4444;
}

.new-record {
    color: #16a34a;
}


/* =====================================
   РЕКОРДЫ
===================================== */

.records {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 18px;

    padding: 25px;

    margin-top: 30px;
}

.records h2 {
    text-align: center;

    margin-bottom: 20px;
}

.record-row {
    display: flex;

    justify-content: space-between;

    padding: 12px 5px;

    border-bottom: 1px solid #eef0f3;
}

.record-row:last-child {
    border-bottom: none;
}


/* =====================================
   FOOTER
===================================== */

footer {
    margin-top: 40px;

    background: #111827;

    color: #9ca3af;

    text-align: center;

    padding: 25px;
}


/* =====================================
   МОБИЛЬНАЯ ВЕРСИЯ
===================================== */

@media (max-width: 600px) {

    .title h1 {
        font-size: 32px;
    }

    .container {
        padding: 25px 12px;
    }

    .stat {
        min-width: 100px;

        padding: 12px 15px;
    }

    #game {
        width: 96vw;

        border-width: 4px;

        border-radius: 12px;
    }

    .touch-hint {
        font-size: 14px;
    }

}

</style>

</head>


<body>


<!-- =====================================
     ШАПКА
===================================== -->

<header>

    <div class="header">

        <a href="index.html" class="logo">
            EasyFlow
        </a>

        <a href="games.html" class="back">
            ← Игры
        </a>

    </div>

</header>



<!-- =====================================
     ОСНОВНОЙ КОНТЕНТ
===================================== -->

<main class="container">


    <!-- ЗАГОЛОВОК -->

    <div class="title">

        <h1>🏓 Пинг-понг</h1>

        <p>
            Играй против компьютера и набери больше очков!
        </p>

    </div>



    <!-- =================================
         СЛОЖНОСТЬ
    ================================== -->

    <div class="difficulty">

        <h2>
            Выбери сложность
        </h2>

        <div class="levels">

            <button
                class="level easy active"
                id="easyButton"
                type="button"
                onclick="selectDifficulty('easy')"
            >
                🟢 Лёгкий
            </button>

            <button
                class="level medium"
                id="mediumButton"
                type="button"
                onclick="selectDifficulty('medium')"
            >
                🟡 Средний
            </button>

            <button
                class="level hard"
                id="hardButton"
                type="button"
                onclick="selectDifficulty('hard')"
            >
                🔴 Сложный
            </button>

        </div>

    </div>



    <!-- =================================
         СТАТИСТИКА
    ================================== -->

    <div class="info">

        <div class="stat">

            <span>
                Ты
            </span>

            <strong id="playerScore">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                🏆 Рекорд
            </span>

            <strong id="record">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                Компьютер
            </span>

            <strong id="computerScore">
                0
            </strong>

        </div>

    </div>



    <!-- =================================
         ИГРОВОЕ ПОЛЕ
    ================================== -->

    <div class="game-wrapper">

        <canvas
            id="game"
            width="700"
            height="450"
        ></canvas>

    </div>


    <div class="touch-hint">
        👆 На телефоне веди пальцем вверх или вниз по полю
    </div>



    <!-- =================================
         СООБЩЕНИЕ
    ================================== -->

    <div
        id="message"
        class="message"
    >
        Нажми «Начать игру»
    </div>



    <!-- =================================
         КНОПКИ
    ================================== -->

    <div class="buttons">

        <button
            class="main-button"
            type="button"
            onclick="startGame()"
        >
            ▶️ Начать игру
        </button>

        <button
            class="main-button pause-button"
            type="button"
            onclick="togglePause()"
        >
            ⏸️ Пауза
        </button>

    </div>



    <!-- =================================
         РЕКОРДЫ
    ================================== -->

    <div class="records">

        <h2>
            🏆 Мои рекорды
        </h2>


        <div class="record-row">

            <span>
                🟢 Лёгкий
            </span>

            <strong id="easyRecord">
                0
            </strong>

        </div>


        <div class="record-row">

            <span>
                🟡 Средний
            </span>

            <strong id="mediumRecord">
                0
            </strong>

        </div>


        <div class="record-row">

            <span>
                🔴 Сложный
            </span>

            <strong id="hardRecord">
                0
            </strong>

        </div>

    </div>

</main>



<!-- =====================================
     FOOTER
===================================== -->

<footer>

    © 2026 EasyFlow

</footer>



<script>

/* =====================================
   ПОЛУЧАЕМ CANVAS
===================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* =====================================
   НАСТРОЙКИ
===================================== */

const settings = {

    easy: {

        computerSpeed: 3.2,

        ballSpeed: 4,

        name: "Легко"

    },

    medium: {

        computerSpeed: 4.8,

        ballSpeed: 5,

        name: "Средне"

    },

    hard: {

        computerSpeed: 6.5,

        ballSpeed: 6,

        name: "Сложно"

    }

};


let difficulty = "easy";


/* =====================================
   СОСТОЯНИЕ ИГРЫ
===================================== */

let animation = null;

let gameRunning = false;

let paused = false;

let gameOver = false;

let playerScore = 0;

let computerScore = 0;


/* =====================================
   РАКЕТКИ
===================================== */

const paddleWidth = 15;

const paddleHeight = 90;


const player = {

    x: 25,

    y:
        canvas.height / 2 -
        paddleHeight / 2,

    width: paddleWidth,

    height: paddleHeight,

    speed: 7

};


const computer = {

    x:
        canvas.width - 40,

    y:
        canvas.height / 2 -
        paddleHeight / 2,

    width: paddleWidth,

    height: paddleHeight

};


/* =====================================
   МЯЧ
===================================== */

const ball = {

    x: canvas.width / 2,

    y: canvas.height / 2,

    radius: 9,

    speedX: 5,

    speedY: 3

};


/* =====================================
   КЛАВИАТУРА
===================================== */

const keys = {

    up: false,

    down: false

};


/* =====================================
   РЕКОРДЫ
===================================== */

function getRecord(level) {

    return Number(
        localStorage.getItem(
            "easyflow_pingpong_record_" + level
        ) || 0
    );

}


function saveRecord(level, value) {

    localStorage.setItem(

        "easyflow_pingpong_record_" + level,

        String(value)

    );

}


function updateRecords() {

    document.getElementById(
        "easyRecord"
    ).textContent =
        getRecord("easy");


    document.getElementById(
        "mediumRecord"
    ).textContent =
        getRecord("medium");


    document.getElementById(
        "hardRecord"
    ).textContent =
        getRecord("hard");


    document.getElementById(
        "record"
    ).textContent =
        getRecord(difficulty);

}


/* =====================================
   ВЫБОР СЛОЖНОСТИ
===================================== */

function selectDifficulty(level) {

    if (gameRunning) {

        alert(
            "Сначала закончи текущую игру."
        );

        return;

    }


    difficulty = level;


    document
        .querySelectorAll(".level")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    document
        .getElementById(
            level + "Button"
        )
        .classList.add("active");


    updateRecords();

    drawStartScreen();

}


/* =====================================
   СБРОС МЯЧА
===================================== */

function resetBall(direction) {

    ball.x =
        canvas.width / 2;

    ball.y =
        canvas.height / 2;


    ball.speedX =
        settings[difficulty].ballSpeed *
        direction;


    /*
       Ограничиваем вертикальную
       скорость мяча
    */

    ball.speedY =
        Math.random() * 4 - 2;


    /*
       Не допускаем слишком
       маленькую скорость
    */

    if (Math.abs(ball.speedY) < 1) {

        ball.speedY =
            ball.speedY < 0
                ? -1
                : 1;

    }

}


/* =====================================
   НАЧАЛО ИГРЫ
===================================== */

function startGame() {

    cancelAnimationFrame(animation);


    playerScore = 0;

    computerScore = 0;


    document.getElementById(
        "playerScore"
    ).textContent = "0";


    document.getElementById(
        "computerScore"
    ).textContent = "0";


    player.y =
        canvas.height / 2 -
        paddleHeight / 2;


    computer.y =
        canvas.height / 2 -
        paddleHeight / 2;


    resetBall(
        Math.random() > 0.5
            ? 1
            : -1
    );


    gameRunning = true;

    paused = false;

    gameOver = false;


    document.getElementById(
        "message"
    ).textContent =
        "🏓 Игра началась!";


    document.getElementById(
        "message"
    ).className =
        "message";


    gameLoop();

}


/* =====================================
   ИГРОВОЙ ЦИКЛ
===================================== */

function gameLoop() {

    if (!gameRunning) {

        return;

    }


    if (!paused) {

        update();

        draw();

    }


    animation =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================
   ОБНОВЛЕНИЕ ИГРЫ
===================================== */

function update() {


    /* ================================
       ИГРОК
    ================================= */

    if (keys.up) {

        player.y -=
            player.speed;

    }


    if (keys.down) {

        player.y +=
            player.speed;

    }


    /* Ограничение игрока */

    if (player.y < 0) {

        player.y = 0;

    }


    if (
        player.y +
        player.height >
        canvas.height
    ) {

        player.y =
            canvas.height -
            player.height;

    }



    /* ================================
       КОМПЬЮТЕР
    ================================= */

    const computerCenter =
        computer.y +
        computer.height / 2;


    const computerSpeed =
        settings[difficulty]
            .computerSpeed;


    /*
       Компьютер двигается
       за мячом
    */

    if (
        computerCenter <
        ball.y - 10
    ) {

        computer.y +=
            computerSpeed;

    }


    if (
        computerCenter >
        ball.y + 10
    ) {

        computer.y -=
            computerSpeed;

    }


    /* Ограничение компьютера */

    if (computer.y < 0) {

        computer.y = 0;

    }


    if (
        computer.y +
        computer.height >
        canvas.height
    ) {

        computer.y =
            canvas.height -
            computer.height;

    }



    /* ================================
       МЯЧ
    ================================= */

    ball.x +=
        ball.speedX;

    ball.y +=
        ball.speedY;



    /* ================================
       ВЕРХНЯЯ СТЕНА
    ================================= */

    if (
        ball.y -
        ball.radius <= 0
    ) {

        ball.y =
            ball.radius;

        ball.speedY =
            Math.abs(ball.speedY);

    }



    /* ================================
       НИЖНЯЯ СТЕНА
    ================================= */

    if (
        ball.y +
        ball.radius >=
        canvas.height
    ) {

        ball.y =
            canvas.height -
            ball.radius;

        ball.speedY =
            -Math.abs(ball.speedY);

    }



    /* ================================
       УДАР ИГРОКА
    ================================= */

    if (

        ball.x -
        ball.radius <=
        player.x +
        player.width &&

        ball.x +
        ball.radius >=
        player.x &&

        ball.y +
        ball.radius >=
        player.y &&

        ball.y -
        ball.radius <=
        player.y +
        player.height &&

        ball.speedX < 0

    ) {

        ball.x =
            player.x +
            player.width +
            ball.radius;


        ball.speedX =
            Math.abs(
                ball.speedX
            ) * 1.03;


        const hitPosition =
            (
                ball.y -
                (
                    player.y +
                    player.height / 2
                )
            ) /
            (
                player.height / 2
            );


        ball.speedY +=
            hitPosition * 2;


        limitBallSpeed();

    }



    /* ================================
       УДАР КОМПЬЮТЕРА
    ================================= */

    if (

        ball.x +
        ball.radius >=
        computer.x &&

        ball.x -
        ball.radius <=
        computer.x +
        computer.width &&

        ball.y +
        ball.radius >=
        computer.y &&

        ball.y -
        ball.radius <=
        computer.y +
        computer.height &&

        ball.speedX > 0

    ) {

        ball.x =
            computer.x -
            ball.radius;


        ball.speedX =
            -Math.abs(
                ball.speedX
            ) * 1.03;


        const hitPosition =
            (
                ball.y -
                (
                    computer.y +
                    computer.height / 2
                )
            ) /
            (
                computer.height / 2
            );


        ball.speedY +=
            hitPosition * 2;


        limitBallSpeed();

    }



    /* ================================
       МЯЧ УШЁЛ СЛЕВА
    ================================= */

    if (
        ball.x <
        -ball.radius
    ) {

        computerScore++;


        document.getElementById(
            "computerScore"
        ).textContent =
            computerScore;


        checkWinner();


        if (!gameOver) {

            resetBall(1);

        }

    }



    /* ================================
       МЯЧ УШЁЛ СПРАВА
    ================================= */

    if (
        ball.x >
        canvas.width +
        ball.radius
    ) {

        playerScore++;


        document.getElementById(
            "playerScore"
        ).textContent =
            playerScore;


        checkWinner();


        if (!gameOver) {

            resetBall(-1);

        }

    }

}


/* =====================================
   ОГРАНИЧЕНИЕ СКОРОСТИ МЯЧА
===================================== */

function limitBallSpeed() {

    const maxSpeed = 11;

    if (ball.speedY > maxSpeed) {

        ball.speedY =
            maxSpeed;

    }

    if (ball.speedY < -maxSpeed) {

        ball.speedY =
            -maxSpeed;

    }

}


/* =====================================
   ПРОВЕРКА ПОБЕДИТЕЛЯ
===================================== */

function checkWinner() {

    const winningScore = 5;


    if (
        playerScore >=
        winningScore
    ) {

        finishGame(true);

        return;

    }


    if (
        computerScore >=
        winningScore
    ) {

        finishGame(false);

    }

}


/* =====================================
   ЗАВЕРШЕНИЕ ИГРЫ
===================================== */

function finishGame(playerWon) {

    gameRunning = false;

    gameOver = true;

    paused = false;


    cancelAnimationFrame(
        animation
    );


    if (playerWon) {

        const oldRecord =
            getRecord(difficulty);


        if (
            playerScore >
            oldRecord
        ) {

            saveRecord(
                difficulty,
                playerScore
            );


            document.getElementById(
                "message"
            ).textContent =
                "🏆 Победа! Новый рекорд: " +
                playerScore;


            document.getElementById(
                "message"
            ).className =
                "message new-record";


        } else {

            document.getElementById(
                "message"
            ).textContent =
                "🏆 Ты победил! Счёт: " +
                playerScore +
                " : " +
                computerScore;


            document.getElementById(
                "message"
            ).className =
                "message new-record";

        }


        updateRecords();


    } else {

        document.getElementById(
            "message"
        ).textContent =
            "💥 Компьютер победил! Счёт: " +
            playerScore +
            " : " +
            computerScore;


        document.getElementById(
            "message"
        ).className =
            "message game-over";

    }


    draw();

}


/* =====================================
   ПАУЗА
===================================== */

function togglePause() {

    if (
        !gameRunning ||
        gameOver
    ) {

        return;

    }


    paused =
        !paused;


    if (paused) {

        document.getElementById(
            "message"
        ).textContent =
            "⏸️ Игра на паузе";


    } else {

        document.getElementById(
            "message"
        ).textContent =
            "▶️ Игра продолжается";

    }


    draw();

}


/* =====================================
   КЛАВИАТУРА — НАЖАТИЕ
===================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();


        if (
            event.key === "ArrowUp" ||
            key === "w"
        ) {

            event.preventDefault();

            keys.up = true;

        }


        if (
            event.key === "ArrowDown" ||
            key === "s"
        ) {

            event.preventDefault();

            keys.down = true;

        }


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            togglePause();

        }

    }
);


/* =====================================
   КЛАВИАТУРА — ОТПУСКАНИЕ
===================================== */

document.addEventListener(
    "keyup",
    function(event) {

        const key =
            event.key.toLowerCase();


        if (
            event.key === "ArrowUp" ||
            key === "w"
        ) {

            keys.up = false;

        }


        if (
            event.key === "ArrowDown" ||
            key === "s"
        ) {

            keys.down = false;

        }

    }
);


/* =====================================
   УПРАВЛЕНИЕ МЫШЬЮ
===================================== */

function movePlayerToY(clientY) {

    if (
        !gameRunning ||
        gameOver ||
        paused
    ) {

        return;

    }


    const rect =
        canvas.getBoundingClientRect();


    /*
       Переводим координаты
       мыши/пальца в координаты canvas.
    */

    const scaleY =
        canvas.height /
        rect.height;


    const y =
        (clientY - rect.top) *
        scaleY;


    /*
       Центр ракетки следует
       за курсором.
    */

    player.y =
        y -
        player.height / 2;


    /*
       Не даём ракетке
       выйти за пределы.
    */

    if (player.y < 0) {

        player.y = 0;

    }


    if (
        player.y +
        player.height >
        canvas.height
    ) {

        player.y =
            canvas.height -
            player.height;

    }

}


/* =====================================
   МЫШЬ
===================================== */

canvas.addEventListener(
    "mousemove",
    function(event) {

        movePlayerToY(
            event.clientY
        );

    }
);


/* =====================================
   TOUCH — НАЧАЛО
===================================== */

canvas.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();


        if (
            event.touches.length > 0
        ) {

            movePlayerToY(
                event.touches[0].clientY
            );

        }

    },
    {
        passive: false
    }
);


/* =====================================
   TOUCH — ДВИЖЕНИЕ
===================================== */

canvas.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();


        if (
            event.touches.length > 0
        ) {

            movePlayerToY(
                event.touches[0].clientY
            );

        }

    },
    {
        passive: false
    }
);


/* =====================================
   РИСОВАНИЕ
===================================== */

function draw() {

    /*
       Фон
    */

    ctx.fillStyle =
        "#111827";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Центральная линия
    */

    ctx.strokeStyle =
        "rgba(255,255,255,0.25)";

    ctx.lineWidth = 2;

    ctx.setLineDash([
        10,
        10
    ]);


    ctx.beginPath();

    ctx.moveTo(
        canvas.width / 2,
        0
    );

    ctx.lineTo(
        canvas.width / 2,
        canvas.height
    );

    ctx.stroke();


    ctx.setLineDash([]);


    /*
       Центральный круг
    */

    ctx.strokeStyle =
        "rgba(255,255,255,0.2)";

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.arc(
        canvas.width / 2,
        canvas.height / 2,
        70,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /*
       Ракетка игрока
    */

    ctx.fillStyle =
        "#2563eb";


    ctx.beginPath();

    ctx.roundRect(
        player.x,
        player.y,
        player.width,
        player.height,
        7
    );

    ctx.fill();


    /*
       Ракетка компьютера
    */

    ctx.fillStyle =
        "#ef4444";


    ctx.beginPath();

    ctx.roundRect(
        computer.x,
        computer.y,
        computer.width,
        computer.height,
        7
    );

    ctx.fill();


    /*
       Мяч
    */

    ctx.fillStyle =
        "#ffffff";


    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Счёт на поле
    */

    ctx.fillStyle =
        "rgba(255,255,255,0.5)";

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 45px Arial";


    ctx.fillText(
        playerScore,
        canvas.width / 2 - 70,
        65
    );


    ctx.fillText(
        computerScore,
        canvas.width / 2 + 70,
        65
    );


    /*
       Пауза
    */

    if (paused) {

        ctx.fillStyle =
            "rgba(0,0,0,0.55)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 40px Arial";

        ctx.fillText(
            "⏸️ ПАУЗА",
            canvas.width / 2,
            canvas.height / 2
        );

    }

}


/* =====================================
   СТАРТОВЫЙ ЭКРАН
===================================== */

function drawStartScreen() {

    ctx.fillStyle =
        "#111827";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Центральная линия
    */

    ctx.strokeStyle =
        "rgba(255,255,255,0.2)";

    ctx.lineWidth = 2;

    ctx.setLineDash([
        10,
        10
    ]);


    ctx.beginPath();

    ctx.moveTo(
        canvas.width / 2,
        0
    );

    ctx.lineTo(
        canvas.width / 2,
        canvas.height
    );

    ctx.stroke();


    ctx.setLineDash([]);


    /*
       Центральный круг
    */

    ctx.beginPath();

    ctx.arc(
        canvas.width / 2,
        canvas.height / 2,
        70,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /*
       Заголовок
    */

    ctx.fillStyle =
        "#2563eb";

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 40px Arial";


    ctx.fillText(
        "🏓 ПИНГ-ПОНГ",
        canvas.width / 2,
        190
    );


    /*
       Сложность
    */

    ctx.fillStyle =
        "white";

    ctx.font =
        "20px Arial";


    ctx.fillText(
        "Сложность: " +
        settings[difficulty].name,
        canvas.width / 2,
        235
    );


    /*
       Подсказка
    */

    ctx.fillStyle =
        "#94a3b8";

    ctx.font =
        "16px Arial";


    ctx.fillText(
        "Нажми «Начать игру»",
        canvas.width / 2,
        280
    );

}


/* =====================================
   ЗАПУСК СТРАНИЦЫ
===================================== */

updateRecords();

drawStartScreen();

</script>
