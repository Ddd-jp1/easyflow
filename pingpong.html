<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>EasyFlow — Пинг-понг</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --main: #2563eb;
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #111827;
    --muted: #64748b;
    --border: #e5e7eb;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 18px 6%;
}

.header {
    width: 100%;
    max-width: 900px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo,
.back {
    color: var(--main);
    text-decoration: none;
    font-weight: bold;
}

.logo {
    font-size: 27px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 35px 20px;
}

.title {
    text-align: center;
    margin-bottom: 25px;
}

.title h1 {
    font-size: 40px;
    color: var(--main);
    margin-bottom: 8px;
}

.title p {
    color: var(--muted);
}

.difficulty,
.records {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
}

.difficulty {
    margin-bottom: 20px;
    text-align: center;
}

.difficulty h2 {
    margin-bottom: 15px;
}

.levels {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.level {
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

.level:hover {
    transform: translateY(-2px);
}

.level:active {
    transform: translateY(0);
}

.level.active.easy {
    border-color: #22c55e;
    background: #dcfce7;
    color: #166534;
}

.level.active.medium {
    border-color: #eab308;
    background: #fef9c3;
    color: #854d0e;
}

.level.active.hard {
    border-color: #ef4444;
    background: #fee2e2;
    color: #991b1b;
}

.info {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 25px;
    text-align: center;
    min-width: 130px;
}

.stat span {
    display: block;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 5px;
}

.stat strong {
    font-size: 23px;
}

.game-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
}

#game {
    display: block;

    width: min(90vw, 700px);
    max-width: 100%;

    height: auto;
    aspect-ratio: 700 / 450;

    background: #111827;

    border: 5px solid var(--main);
    border-radius: 15px;

    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;

    cursor: crosshair;
}

.touch-hint {
    text-align: center;
    color: var(--muted);
    margin-top: 14px;
    font-size: 15px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.main-button {
    border: none;
    background: var(--main);
    color: white;

    padding: 13px 22px;
    border-radius: 11px;

    cursor: pointer;
    font-weight: bold;
    font-size: 16px;

    transition: 0.2s;
}

.main-button:hover {
    background: #1d4ed8;
}

.main-button:active {
    transform: scale(0.97);
}

.pause-button {
    background: #64748b;
}

.pause-button:hover {
    background: #475569;
}

.message {
    text-align: center;
    margin-top: 20px;
    min-height: 25px;
    font-weight: bold;
}

.game-over {
    color: #ef4444;
}

.new-record {
    color: #16a34a;
}

.records {
    margin-top: 30px;
}

.records h2 {
    text-align: center;
    margin-bottom: 20px;
}

.record-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 5px;
    border-bottom: 1px solid #eef0f3;
}

.record-row:last-child {
    border-bottom: none;
}

footer {
    margin-top: 40px;
    background: #111827;
    color: #9ca3af;
    text-align: center;
    padding: 25px;
}

@media (max-width: 600px) {
    .title h1 {
        font-size: 32px;
    }

    .container {
        padding: 25px 12px;
    }

    .stat {
        min-width: 100px;
        padding: 12px 15px;
    }

    #game {
        width: 96vw;
        border-width: 4px;
        border-radius: 12px;
    }

    .touch-hint {
        font-size: 14px;
    }

    .level {
        padding: 11px 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">
        <a href="index.html" class="logo">EasyFlow</a>

        <a href="games.html" class="back">
            ← Игры
        </a>
    </div>
</header>

<main class="container">

    <div class="title">
        <h1>🏓 Пинг-понг</h1>

        <p>
            Играй против компьютера и набери больше очков!
        </p>
    </div>

    <div class="difficulty">

        <h2>Выбери сложность</h2>

        <div class="levels">

            <button
                class="level easy active"
                id="easyButton"
                type="button"
                onclick="selectDifficulty('easy')"
            >
                🟢 Лёгкий
            </button>

            <button
                class="level medium"
                id="mediumButton"
                type="button"
                onclick="selectDifficulty('medium')"
            >
                🟡 Средний
            </button>

            <button
                class="level hard"
                id="hardButton"
                type="button"
                onclick="selectDifficulty('hard')"
            >
                🔴 Сложный
            </button>

        </div>
    </div>

    <div class="info">

        <div class="stat">
            <span>Ты</span>

            <strong id="playerScore">0</strong>
        </div>

        <div class="stat">
            <span>🏆 Рекорд</span>

            <strong id="record">0</strong>
        </div>

        <div class="stat">
            <span>Компьютер</span>

            <strong id="computerScore">0</strong>
        </div>

    </div>

    <div class="game-wrapper">

        <canvas
            id="game"
            width="700"
            height="450"
        ></canvas>

    </div>

    <div class="touch-hint">
        👆 На телефоне веди пальцем вверх или вниз по полю
    </div>

    <div
        id="message"
        class="message"
    >
        Нажми «Начать игру»
    </div>

    <div class="buttons">

        <button
            class="main-button"
            type="button"
            onclick="startGame()"
        >
            ▶️ Начать игру
        </button>

        <button
            class="main-button pause-button"
            type="button"
            onclick="togglePause()"
        >
            ⏸️ Пауза
        </button>

    </div>

    <div class="records">

        <h2>🏆 Мои рекорды</h2>

        <div class="record-row">
            <span>🟢 Лёгкий</span>

            <strong id="easyRecord">0</strong>
        </div>

        <div class="record-row">
            <span>🟡 Средний</span>

            <strong id="mediumRecord">0</strong>
        </div>

        <div class="record-row">
            <span>🔴 Сложный</span>

            <strong id="hardRecord">0</strong>
        </div>

    </div>

</main>

<footer>
    © 2026 EasyFlow
</footer>

<script>

/* =========================================
   CANVAS
========================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");


/* =========================================
   НАСТРОЙКИ СЛОЖНОСТИ
========================================= */

const settings = {

    easy: {
        computerSpeed: 3.2,
        ballSpeed: 4,
        name: "Легко"
    },

    medium: {
        computerSpeed: 4.8,
        ballSpeed: 5,
        name: "Средне"
    },

    hard: {
        computerSpeed: 6.5,
        ballSpeed: 6,
        name: "Сложно"
    }

};


/* =========================================
   СОСТОЯНИЕ
========================================= */

let difficulty = "easy";

let animation = null;

let gameRunning = false;
let paused = false;
let gameOver = false;

let playerScore = 0;
let computerScore = 0;


/* =========================================
   РАКЕТКИ
========================================= */

const paddleWidth = 15;
const paddleHeight = 90;

const player = {

    x: 25,

    y:
        canvas.height / 2 -
        paddleHeight / 2,

    width: paddleWidth,
    height: paddleHeight,

    speed: 7

};

const computer = {

    x:
        canvas.width -
        40,

    y:
        canvas.height / 2 -
        paddleHeight / 2,

    width: paddleWidth,
    height: paddleHeight

};


/* =========================================
   МЯЧ
========================================= */

const ball = {

    x: canvas.width / 2,
    y: canvas.height / 2,

    radius: 9,

    speedX: 5,
    speedY: 3

};


/* =========================================
   КЛАВИАТУРА
========================================= */

const keys = {
    up: false,
    down: false
};


/* =========================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
========================================= */

function updateScoreboard() {

    document.getElementById("playerScore").textContent =
        playerScore;

    document.getElementById("computerScore").textContent =
        computerScore;

}


function setMessage(text, className = "message") {

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.className = className;

}


/* =========================================
   РЕКОРДЫ
========================================= */

function getRecord(level) {

    return Number(
        localStorage.getItem(
            "easyflow_pingpong_record_" + level
        ) || 0
    );

}


function saveRecord(level, value) {

    localStorage.setItem(
        "easyflow_pingpong_record_" + level,
        String(value)
    );

}


function updateRecords() {

    document.getElementById("easyRecord").textContent =
        getRecord("easy");

    document.getElementById("mediumRecord").textContent =
        getRecord("medium");

    document.getElementById("hardRecord").textContent =
        getRecord("hard");

    document.getElementById("record").textContent =
        getRecord(difficulty);

}


/* =========================================
   СЛОЖНОСТЬ
========================================= */

function selectDifficulty(level) {

    if (!settings[level]) {
        return;
    }

    if (gameRunning) {

        setMessage(
            "Сначала закончи текущую игру.",
            "message game-over"
        );

        return;
    }

    difficulty = level;

    document
        .querySelectorAll(".level")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    const button =
        document.getElementById(
            level + "Button"
        );

    if (button) {
        button.classList.add("active");
    }


    updateRecords();

    drawStartScreen();

}


/* =========================================
   СБРОС МЯЧА
========================================= */

function resetBall(direction) {

    ball.x =
        canvas.width / 2;

    ball.y =
        canvas.height / 2;


    ball.speedX =
        settings[difficulty].ballSpeed *
        direction;


    ball.speedY =
        Math.random() * 4 - 2;


    if (Math.abs(ball.speedY) < 1) {

        ball.speedY =
            ball.speedY < 0
                ? -1
                : 1;

    }

}


/* =========================================
   НАЧАЛО ИГРЫ
========================================= */

function startGame() {

    if (animation !== null) {

        cancelAnimationFrame(animation);

        animation = null;

    }


    playerScore = 0;
    computerScore = 0;

    updateScoreboard();


    player.y =
        canvas.height / 2 -
        paddleHeight / 2;

    computer.y =
        canvas.height / 2 -
        paddleHeight / 2;


    resetBall(
        Math.random() >= 0.5
            ? 1
            : -1
    );


    gameRunning = true;
    paused = false;
    gameOver = false;


    setMessage(
        "🏓 Игра началась!"
    );


    animation =
        requestAnimationFrame(gameLoop);

}


/* =========================================
   ИГРОВОЙ ЦИКЛ
========================================= */

function gameLoop() {

    if (!gameRunning) {

        animation = null;

        return;
    }


    if (!paused) {

        update();
        draw();

    }


    animation =
        requestAnimationFrame(gameLoop);

}


/* =========================================
   ОБНОВЛЕНИЕ ИГРЫ
========================================= */

function update() {

    /* -------------------------------------
       ИГРОК
    ------------------------------------- */

    if (keys.up) {
        player.y -= player.speed;
    }

    if (keys.down) {
        player.y += player.speed;
    }


    limitPaddle(player);


    /* -------------------------------------
       КОМПЬЮТЕР
    ------------------------------------- */

    const computerCenter =
        computer.y +
        computer.height / 2;

    const computerSpeed =
        settings[difficulty].computerSpeed;


    if (
        computerCenter <
        ball.y - 10
    ) {

        computer.y += computerSpeed;

    } else if (
        computerCenter >
        ball.y + 10
    ) {

        computer.y -= computerSpeed;

    }


    limitPaddle(computer);


    /* -------------------------------------
       МЯЧ
    ------------------------------------- */

    ball.x += ball.speedX;
    ball.y += ball.speedY;


    /* -------------------------------------
       ВЕРХНЯЯ СТЕНА
    ------------------------------------- */

    if (
        ball.y - ball.radius <= 0
    ) {

        ball.y =
            ball.radius;

        ball.speedY =
            Math.abs(ball.speedY);

    }


    /* -------------------------------------
       НИЖНЯЯ СТЕНА
    ------------------------------------- */

    if (
        ball.y + ball.radius >=
        canvas.height
    ) {

        ball.y =
            canvas.height -
            ball.radius;

        ball.speedY =
            -Math.abs(ball.speedY);

    }


    /* -------------------------------------
       РАКЕТКА ИГРОКА
    ------------------------------------- */

    if (
        ball.speedX < 0 &&

        ball.x - ball.radius <=
        player.x + player.width &&

        ball.x + ball.radius >=
        player.x &&

        ball.y + ball.radius >=
        player.y &&

        ball.y - ball.radius <=
        player.y + player.height
    ) {

        ball.x =
            player.x +
            player.width +
            ball.radius;


        ball.speedX =
            Math.abs(ball.speedX) * 1.03;


        const hitPosition =
            (
                ball.y -
                (
                    player.y +
                    player.height / 2
                )
            ) /
            (
                player.height / 2
            );


        ball.speedY +=
            hitPosition * 2;


        limitBallSpeed();

    }


    /* -------------------------------------
       РАКЕТКА КОМПЬЮТЕРА
    ------------------------------------- */

    if (
        ball.speedX > 0 &&

        ball.x + ball.radius >=
        computer.x &&

        ball.x - ball.radius <=
        computer.x +
        computer.width &&

        ball.y + ball.radius >=
        computer.y &&

        ball.y - ball.radius <=
        computer.y +
        computer.height
    ) {

        ball.x =
            computer.x -
            ball.radius;


        ball.speedX =
            -Math.abs(ball.speedX) * 1.03;


        const hitPosition =
            (
                ball.y -
                (
                    computer.y +
                    computer.height / 2
                )
            ) /
            (
                computer.height / 2
            );


        ball.speedY +=
            hitPosition * 2;


        limitBallSpeed();

    }


    /* -------------------------------------
       МЯЧ УШЁЛ СЛЕВА
    ------------------------------------- */

    if (
        ball.x <
        -ball.radius
    ) {

        computerScore++;

        updateScoreboard();

        checkWinner();

        if (!gameOver) {

            resetBall(1);

        }

        return;
    }


    /* -------------------------------------
       МЯЧ УШЁЛ СПРАВА
    ------------------------------------- */

    if (
        ball.x >
        canvas.width +
        ball.radius
    ) {

        playerScore++;

        updateScoreboard();

        checkWinner();

        if (!gameOver) {

            resetBall(-1);

        }

    }

}


/* =========================================
   ОГРАНИЧЕНИЕ РАКЕТКИ
========================================= */

function limitPaddle(paddle) {

    if (paddle.y < 0) {
        paddle.y = 0;
    }


    if (
        paddle.y +
        paddle.height >
        canvas.height
    ) {

        paddle.y =
            canvas.height -
            paddle.height;

    }

}


/* =========================================
   ОГРАНИЧЕНИЕ СКОРОСТИ
========================================= */

function limitBallSpeed() {

    const maxSpeed = 11;

    if (
        ball.speedY >
        maxSpeed
    ) {

        ball.speedY =
            maxSpeed;

    }


    if (
        ball.speedY <
        -maxSpeed
    ) {

        ball.speedY =
            -maxSpeed;

    }

}


/* =========================================
   ПОБЕДИТЕЛЬ
========================================= */

function checkWinner() {

    const winningScore = 5;


    if (
        playerScore >=
        winningScore
    ) {

        finishGame(true);

        return;

    }


    if (
        computerScore >=
        winningScore
    ) {

        finishGame(false);

    }

}


/* =========================================
   ЗАВЕРШЕНИЕ
========================================= */

function finishGame(playerWon) {

    gameRunning = false;
    gameOver = true;
    paused = false;


    if (animation !== null) {

        cancelAnimationFrame(animation);

        animation = null;

    }


    if (playerWon) {

        const oldRecord =
            getRecord(difficulty);


        if (
            playerScore >
            oldRecord
        ) {

            saveRecord(
                difficulty,
                playerScore
            );


            setMessage(
                "🏆 Победа! Новый рекорд: " +
                playerScore,
                "message new-record"
            );

        } else {

            setMessage(
                "🏆 Ты победил! Счёт: " +
                playerScore +
                " : " +
                computerScore,
                "message new-record"
            );

        }


        updateRecords();

    } else {

        setMessage(
            "💥 Компьютер победил! Счёт: " +
            playerScore +
            " : " +
            computerScore,
            "message game-over"
        );

    }


    draw();

}


/* =========================================
   ПАУЗА
========================================= */

function togglePause() {

    if (
        !gameRunning ||
        gameOver
    ) {

        return;
    }


    paused =
        !paused;


    if (paused) {

        setMessage(
            "⏸️ Игра на паузе"
        );

    } else {

        setMessage(
            "▶️ Игра продолжается"
        );

    }


    draw();

}


/* =========================================
   КЛАВИАТУРА
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();


        if (
            event.key === "ArrowUp" ||
            key === "w"
        ) {

            event.preventDefault();

            keys.up = true;

        }


        if (
            event.key === "ArrowDown" ||
            key === "s"
        ) {

            event.preventDefault();

            keys.down = true;

        }


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            togglePause();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        const key =
            event.key.toLowerCase();


        if (
            event.key === "ArrowUp" ||
            key === "w"
        ) {

            keys.up = false;

        }


        if (
            event.key === "ArrowDown" ||
            key === "s"
        ) {

            keys.down = false;

        }

    }
);


/* =========================================
   МЫШЬ / TOUCH
========================================= */

function movePlayerToY(clientY) {

    if (
        !gameRunning ||
        gameOver ||
        paused
    ) {

        return;

    }


    const rect =
        canvas.getBoundingClientRect();


    /*
       Координаты canvas отличаются
       от CSS-размера на телефоне.
    */

    const scaleY =
        canvas.height /
        rect.height;


    const y =
        (
            clientY -
            rect.top
        ) *
        scaleY;


    player.y =
        y -
        player.height / 2;


    limitPaddle(player);

}


/* -----------------------------------------
   POINTER
   Используем pointer events вместо
   отдельных mouse/touch обработчиков.
----------------------------------------- */

canvas.addEventListener(
    "pointermove",
    function(event) {

        if (
            event.pointerType === "mouse" ||
            event.pointerType === "touch" ||
            event.pointerType === "pen"
        ) {

            movePlayerToY(
                event.clientY
            );

        }

    }
);


canvas.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        movePlayerToY(
            event.clientY
        );

    }
);


/* =========================================
   РИСОВАНИЕ
========================================= */

function draw() {

    /* -------------------------------------
       ФОН
    ------------------------------------- */

    ctx.fillStyle =
        "#111827";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* -------------------------------------
       ЦЕНТРАЛЬНАЯ ЛИНИЯ
    ------------------------------------- */

    ctx.strokeStyle =
        "rgba(255,255,255,0.25)";

    ctx.lineWidth = 2;

    ctx.setLineDash([
        10,
        10
    ]);


    ctx.beginPath();

    ctx.moveTo(
        canvas.width / 2,
        0
    );

    ctx.lineTo(
        canvas.width / 2,
        canvas.height
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /* -------------------------------------
       ЦЕНТРАЛЬНЫЙ КРУГ
    ------------------------------------- */

    ctx.strokeStyle =
        "rgba(255,255,255,0.2)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        canvas.width / 2,
        canvas.height / 2,
        70,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /* -------------------------------------
       РАКЕТКА ИГРОКА
    ------------------------------------- */

    ctx.fillStyle =
        "#2563eb";

    drawRoundedRect(
        player.x,
        player.y,
        player.width,
        player.height,
        7
    );


    /* -------------------------------------
       РАКЕТКА КОМПЬЮТЕРА
    ------------------------------------- */

    ctx.fillStyle =
        "#ef4444";

    drawRoundedRect(
        computer.x,
        computer.y,
        computer.width,
        computer.height,
        7
    );


    /* -------------------------------------
       МЯЧ
    ------------------------------------- */

    ctx.fillStyle =
        "#ffffff";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* -------------------------------------
       СЧЁТ
    ------------------------------------- */

    ctx.fillStyle =
        "rgba(255,255,255,0.5)";

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 45px Arial";


    ctx.fillText(
        playerScore,
        canvas.width / 2 - 70,
        65
    );


    ctx.fillText(
        computerScore,
        canvas.width / 2 + 70,
        65
    );


    /* -------------------------------------
       ПАУЗА
    ------------------------------------- */

    if (paused) {

        ctx.fillStyle =
            "rgba(0,0,0,0.55)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 40px Arial";

        ctx.fillText(
            "ПАУЗА",
            canvas.width / 2,
            canvas.height / 2
        );

    }

}


/* =========================================
   СКРУГЛЁННЫЙ ПРЯМОУГОЛЬНИК
========================================= */

function drawRoundedRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();

    ctx.fill();

}


/* =========================================
   СТАРТОВЫЙ ЭКРАН
========================================= */

function drawStartScreen() {

    ctx.fillStyle =
        "#111827";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Линия */

    ctx.strokeStyle =
        "rgba(255,255,255,0.2)";

    ctx.lineWidth = 2;

    ctx.setLineDash([
        10,
        10
    ]);


    ctx.beginPath();

    ctx.moveTo(
        canvas.width / 2,
        0
    );

    ctx.lineTo(
        canvas.width / 2,
        canvas.height
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /* Круг */

    ctx.beginPath();

    ctx.arc(
        canvas.width / 2,
        canvas.height / 2,
        70,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /* Заголовок */

    ctx.fillStyle =
        "#2563eb";

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 40px Arial";


    ctx.fillText(
        "ПИНГ-ПОНГ",
        canvas.width / 2,
        190
    );


    /* Сложность */

    ctx.fillStyle =
        "white";

    ctx.font =
        "20px Arial";


    ctx.fillText(
        "Сложность: " +
        settings[difficulty].name,
        canvas.width / 2,
        235
    );


    /* Подсказка */

    ctx.fillStyle =
        "#94a3b8";

    ctx.font =
        "16px Arial";


    ctx.fillText(
        "Нажми «Начать игру»",
        canvas.width / 2,
        280
    );

}


/* =========================================
   ЗАПУСК
========================================= */

updateRecords();

drawStartScreen();

</script>
