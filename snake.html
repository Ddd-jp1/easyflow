<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EasyFlow — Змейка</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --green: #22c55e;
    --green-dark: #16a34a;
    --red: #ef4444;
    --yellow: #eab308;
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #111827;
    --muted: #64748b;
    --border: #e5e7eb;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

header {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
}

.header {
    max-width: 900px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    color: var(--blue);
    font-size: 27px;
    font-weight: bold;
    text-decoration: none;
}

.back {
    color: var(--blue);
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 30px 15px;
}

h1 {
    text-align: center;
    color: var(--blue);
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 25px;
}

.difficulty {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 15px;
    text-align: center;
}

.difficulty h2 {
    font-size: 18px;
    margin-bottom: 12px;
}

.levels {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.level {
    border: 2px solid var(--border);
    background: white;
    color: #111827;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

.level:hover {
    transform: translateY(-2px);
}

.level.active {
    border-color: var(--blue);
    background: #dbeafe;
    color: var(--blue-dark);
}

.info {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 20px;
    text-align: center;
    min-width: 110px;
}

.stat span {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 3px;
}

.stat strong {
    font-size: 22px;
}

.game-box {
    display: flex;
    justify-content: center;
}

canvas {
    width: min(92vw, 500px);
    height: min(92vw, 500px);
    background: #111827;
    border: 4px solid var(--blue);
    border-radius: 14px;
    display: block;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: 0 12px 30px rgba(0,0,0,.15);
}

.message {
    text-align: center;
    min-height: 24px;
    margin: 15px 0;
    font-weight: bold;
}

.error {
    color: var(--red);
}

.success {
    color: var(--green);
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.main-button {
    border: none;
    background: var(--blue);
    color: white;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.main-button:hover {
    background: var(--blue-dark);
}

.main-button:active {
    transform: scale(.97);
}

.pause {
    background: #64748b;
}

.pause:hover {
    background: #475569;
}

.controls {
    width: 210px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(3, 65px);
    gap: 7px;
}

.control {
    width: 65px;
    height: 55px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: white;
    font-size: 23px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
}

.control:active {
    background: #dbeafe;
}

.empty {
    visibility: hidden;
}

.records {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-top: 20px;
}

.records h2 {
    text-align: center;
    margin-bottom: 15px;
}

.record {
    display: flex;
    justify-content: space-between;
    padding: 10px 5px;
    border-bottom: 1px solid var(--border);
}

.record:last-child {
    border-bottom: none;
}

footer {
    margin-top: 30px;
    background: #111827;
    color: #9ca3af;
    text-align: center;
    padding: 20px;
}

@media(max-width:600px) {

    .header {
        flex-direction: column;
        gap: 10px;
    }

    .container {
        padding: 25px 10px;
    }

    h1 {
        font-size: 30px;
    }

    .stat {
        min-width: 95px;
        padding: 9px 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">

        <a href="index.html" class="logo">
            EasyFlow
        </a>

        <a href="games.html" class="back">
            ← Все игры
        </a>

    </div>
</header>

<main class="container">

    <h1>🐍 Змейка</h1>

    <p class="subtitle">
        Собирай еду, увеличивай змейку и побей свой рекорд!
    </p>

    <!-- СЛОЖНОСТЬ -->

    <div class="difficulty">

        <h2>Сложность</h2>

        <div class="levels">

            <button
                class="level active"
                data-level="easy"
                type="button">
                🟢 Лёгкий
            </button>

            <button
                class="level"
                data-level="medium"
                type="button">
                🟡 Средний
            </button>

            <button
                class="level"
                data-level="hard"
                type="button">
                🔴 Сложный
            </button>

        </div>

    </div>

    <!-- СТАТИСТИКА -->

    <div class="info">

        <div class="stat">
            <span>Очки</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <span>🏆 Рекорд</span>
            <strong id="record">0</strong>
        </div>

        <div class="stat">
            <span>Скорость</span>
            <strong id="speed">Очень медленно</strong>
        </div>

    </div>

    <!-- ИГРА -->

    <div class="game-box">

        <canvas
            id="game"
            width="500"
            height="500">
        </canvas>

    </div>

    <div id="message" class="message">
        Нажми «Начать»
    </div>

    <!-- КНОПКИ -->

    <div class="buttons">

        <button
            id="startButton"
            class="main-button"
            type="button">
            ▶️ Начать
        </button>

        <button
            id="pauseButton"
            class="main-button pause"
            type="button">
            ⏸️ Пауза
        </button>

    </div>

    <!-- УПРАВЛЕНИЕ -->

    <div class="controls">

        <button class="control empty" type="button"></button>

        <button
            class="control"
            data-direction="up"
            type="button">
            ⬆️
        </button>

        <button class="control empty" type="button"></button>

        <button
            class="control"
            data-direction="left"
            type="button">
            ⬅️
        </button>

        <button
            class="control"
            data-direction="down"
            type="button">
            ⬇️
        </button>

        <button
            class="control"
            data-direction="right"
            type="button">
            ➡️
        </button>

    </div>

    <!-- РЕКОРДЫ -->

    <div class="records">

        <h2>🏆 Рекорды</h2>

        <div class="record">
            <span>🟢 Лёгкий</span>
            <strong id="easyRecord">0</strong>
        </div>

        <div class="record">
            <span>🟡 Средний</span>
            <strong id="mediumRecord">0</strong>
        </div>

        <div class="record">
            <span>🔴 Сложный</span>
            <strong id="hardRecord">0</strong>
        </div>

    </div>

</main>

<footer>
    © 2026 EasyFlow
</footer>

<script>

"use strict";

/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* =========================================
   НАСТРОЙКИ ПОЛЯ
========================================= */

const GRID_SIZE = 25;

const CELL_SIZE =
    canvas.width / GRID_SIZE;


/* =========================================
   СКОРОСТИ
========================================= */

/*
   Чем больше delay,
   тем медленнее змейка.

   🟢 Лёгкий   = 500 мс
   🟡 Средний  = 400 мс
   🔴 Сложный  = 300 мс
*/

const LEVELS = {

    easy: {
        delay: 500,
        name: "Очень медленно"
    },

    medium: {
        delay: 400,
        name: "Медленно"
    },

    hard: {
        delay: 300,
        name: "Немного быстрее"
    }

};


/* =========================================
   СОСТОЯНИЕ ИГРЫ
========================================= */

let snake = [];

let food = {
    x: 15,
    y: 15
};

let direction = "right";

let nextDirection = "right";

let score = 0;

let currentLevel = "easy";

let gameTimer = null;

let gameRunning = false;

let gamePaused = false;


/* =========================================
   DOM
========================================= */

const scoreElement =
    document.getElementById("score");

const recordElement =
    document.getElementById("record");

const speedElement =
    document.getElementById("speed");

const messageElement =
    document.getElementById("message");

const startButton =
    document.getElementById("startButton");

const pauseButton =
    document.getElementById("pauseButton");


/* =========================================
   РЕКОРДЫ
========================================= */

function getRecord(level) {

    const key =
        "easyflow_snake_record_" + level;

    const value =
        Number(localStorage.getItem(key));

    if (
        Number.isFinite(value) &&
        value >= 0
    ) {
        return value;
    }

    return 0;
}


function saveRecord(level, value) {

    localStorage.setItem(
        "easyflow_snake_record_" + level,
        String(value)
    );
}


function updateRecords() {

    const easy =
        getRecord("easy");

    const medium =
        getRecord("medium");

    const hard =
        getRecord("hard");


    document.getElementById(
        "easyRecord"
    ).textContent = easy;


    document.getElementById(
        "mediumRecord"
    ).textContent = medium;


    document.getElementById(
        "hardRecord"
    ).textContent = hard;


    recordElement.textContent =
        getRecord(currentLevel);
}


/* =========================================
   СООБЩЕНИЯ
========================================= */

function showMessage(
    text,
    type = ""
) {

    messageElement.textContent =
        text;

    messageElement.className =
        "message";

    if (type) {

        messageElement.classList.add(
            type
        );

    }
}


/* =========================================
   ВЫБОР СЛОЖНОСТИ
========================================= */

document
    .querySelectorAll(".level")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                if (gameRunning) {

                    showMessage(
                        "Сначала закончи текущую игру.",
                        "error"
                    );

                    return;
                }


                currentLevel =
                    this.dataset.level;


                document
                    .querySelectorAll(".level")
                    .forEach(item => {

                        item.classList.remove(
                            "active"
                        );

                    });


                this.classList.add("active");


                speedElement.textContent =
                    LEVELS[currentLevel].name;


                updateRecords();

                drawStart();

            }
        );

    });


/* =========================================
   НАЧАЛО ИГРЫ
========================================= */

function startGame() {

    stopTimer();


    snake = [

        {
            x: 12,
            y: 12
        },

        {
            x: 11,
            y: 12
        },

        {
            x: 10,
            y: 12
        }

    ];


    direction = "right";

    nextDirection = "right";

    score = 0;

    gameRunning = true;

    gamePaused = false;


    scoreElement.textContent =
        "0";


    speedElement.textContent =
        LEVELS[currentLevel].name;


    recordElement.textContent =
        getRecord(currentLevel);


    showMessage(
        "🏁 Игра началась!"
    );


    createFood();

    draw();


    gameTimer =
        setInterval(
            gameLoop,
            LEVELS[currentLevel].delay
        );

}


/* =========================================
   ОСТАНОВКА ТАЙМЕРА
========================================= */

function stopTimer() {

    if (gameTimer !== null) {

        clearInterval(gameTimer);

        gameTimer = null;

    }

}


/* =========================================
   СОЗДАНИЕ ЕДЫ
========================================= */

function createFood() {

    const freeCells = [];


    for (
        let y = 0;
        y < GRID_SIZE;
        y++
    ) {

        for (
            let x = 0;
            x < GRID_SIZE;
            x++
        ) {

            const occupied =
                snake.some(
                    part =>
                        part.x === x &&
                        part.y === y
                );


            if (!occupied) {

                freeCells.push({
                    x: x,
                    y: y
                });

            }

        }

    }


    if (freeCells.length === 0) {

        finishGame(true);

        return;

    }


    const randomIndex =
        Math.floor(
            Math.random() *
            freeCells.length
        );


    food =
        freeCells[randomIndex];

}


/* =========================================
   ИГРОВОЙ ЦИКЛ
========================================= */

function gameLoop() {

    if (
        !gameRunning ||
        gamePaused
    ) {
        return;
    }


    direction =
        nextDirection;


    const head = {
        x: snake[0].x,
        y: snake[0].y
    };


    switch (direction) {

        case "up":
            head.y--;
            break;

        case "down":
            head.y++;
            break;

        case "left":
            head.x--;
            break;

        case "right":
            head.x++;
            break;

    }


    /* СТЕНА */

    if (
        head.x < 0 ||
        head.x >= GRID_SIZE ||
        head.y < 0 ||
        head.y >= GRID_SIZE
    ) {

        finishGame(false);

        return;

    }


    /* ЕДА */

    const ateFood =
        head.x === food.x &&
        head.y === food.y;


    const bodyToCheck =
        ateFood
            ? snake
            : snake.slice(0, -1);


    /* СТОЛКНОВЕНИЕ */

    const hitSelf =
        bodyToCheck.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        );


    if (hitSelf) {

        finishGame(false);

        return;

    }


    /* ДОБАВЛЯЕМ ГОЛОВУ */

    snake.unshift(head);


    /* СЪЕЛИ ЕДУ */

    if (ateFood) {

        score++;


        scoreElement.textContent =
            score;


        const oldRecord =
            getRecord(currentLevel);


        if (score > oldRecord) {

            saveRecord(
                currentLevel,
                score
            );

            recordElement.textContent =
                score;

        }


        createFood();

    } else {

        snake.pop();

    }


    draw();

}


/* =========================================
   УПРАВЛЕНИЕ
========================================= */

function changeDirection(
    newDirection
) {

    if (
        !gameRunning ||
        gamePaused
    ) {
        return;
    }


    const opposite = {

        up: "down",

        down: "up",

        left: "right",

        right: "left"

    };


    if (
        newDirection ===
        opposite[direction]
    ) {
        return;
    }


    if (
        newDirection ===
        opposite[nextDirection]
    ) {
        return;
    }


    nextDirection =
        newDirection;

}


/* =========================================
   КНОПКИ НА ЭКРАНЕ
========================================= */

document
    .querySelectorAll("[data-direction]")
    .forEach(button => {

        button.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                changeDirection(
                    this.dataset.direction
                );

            }
        );

    });


/* =========================================
   КЛАВИАТУРА
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        let newDirection = null;


        switch (event.key) {

            case "ArrowUp":
            case "w":
            case "W":
            case "ц":
            case "Ц":

                newDirection = "up";
                break;


            case "ArrowDown":
            case "s":
            case "S":
            case "ы":
            case "Ы":

                newDirection = "down";
                break;


            case "ArrowLeft":
            case "a":
            case "A":
            case "ф":
            case "Ф":

                newDirection = "left";
                break;


            case "ArrowRight":
            case "d":
            case "D":
            case "в":
            case "В":

                newDirection = "right";
                break;

        }


        if (newDirection) {

            event.preventDefault();

            changeDirection(
                newDirection
            );

            return;

        }


        if (
            event.code === "Space" ||
            event.key === "Escape"
        ) {

            event.preventDefault();

            togglePause();

        }

    }
);


/* =========================================
   СВАЙПЫ
========================================= */

let touchStartX = 0;

let touchStartY = 0;


canvas.addEventListener(
    "touchstart",
    function(event) {

        if (
            !event.changedTouches.length
        ) {
            return;
        }


        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


canvas.addEventListener(
    "touchend",
    function(event) {

        if (
            !event.changedTouches.length
        ) {
            return;
        }


        const touch =
            event.changedTouches[0];


        const dx =
            touch.clientX -
            touchStartX;


        const dy =
            touch.clientY -
            touchStartY;


        const minimumSwipe = 25;


        if (
            Math.abs(dx) <
            minimumSwipe &&
            Math.abs(dy) <
            minimumSwipe
        ) {
            return;
        }


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            changeDirection(
                dx > 0
                    ? "right"
                    : "left"
            );

        } else {

            changeDirection(
                dy > 0
                    ? "down"
                    : "up"
            );

        }

    },
    {
        passive: true
    }
);


/* =========================================
   ПАУЗА
========================================= */

function togglePause() {

    if (!gameRunning) {
        return;
    }


    gamePaused =
        !gamePaused;


    if (gamePaused) {

        showMessage(
            "⏸️ Игра на паузе"
        );

    } else {

        showMessage(
            "▶️ Игра продолжается"
        );

    }


    draw();

}


/* =========================================
   КОНЕЦ ИГРЫ
========================================= */

function finishGame(
    completed
) {

    stopTimer();


    gameRunning = false;

    gamePaused = false;


    const record =
        getRecord(currentLevel);


    if (score > record) {

        saveRecord(
            currentLevel,
            score
        );

        updateRecords();

    }


    if (completed) {

        showMessage(
            "🏆 Победа! Поле полностью заполнено! Очки: " +
            score,
            "success"
        );

    } else {

        if (score > record) {

            showMessage(
                "🏆 Новый рекорд: " +
                score,
                "success"
            );

        } else {

            showMessage(
                "💥 Игра окончена! Очки: " +
                score,
                "error"
            );

        }

    }


    draw();

}


/* =========================================
   РИСОВАНИЕ
========================================= */

function draw() {

    ctx.fillStyle =
        "#111827";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Сетка */

    ctx.strokeStyle =
        "rgba(255,255,255,0.04)";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i <= GRID_SIZE;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i * CELL_SIZE,
            0
        );

        ctx.lineTo(
            i * CELL_SIZE,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i * CELL_SIZE
        );

        ctx.lineTo(
            canvas.width,
            i * CELL_SIZE
        );

        ctx.stroke();

    }


    /* Еда */

    drawFood();


    /* Змейка */

    snake.forEach(
        function(part, index) {

            drawSnakePart(
                part,
                index
            );

        }
    );


    /* Пауза */

    if (gamePaused) {

        ctx.fillStyle =
            "rgba(0,0,0,.6)";


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle =
            "white";


        ctx.textAlign =
            "center";


        ctx.font =
            "bold 40px Arial";


        ctx.fillText(
            "⏸️ ПАУЗА",
            canvas.width / 2,
            canvas.height / 2
        );

    }

}


/* =========================================
   ЕДА
========================================= */

function drawFood() {

    const centerX =
        food.x * CELL_SIZE +
        CELL_SIZE / 2;


    const centerY =
        food.y * CELL_SIZE +
        CELL_SIZE / 2;


    ctx.fillStyle =
        "#ef4444";


    ctx.beginPath();


    ctx.arc(
        centerX,
        centerY,
        CELL_SIZE / 2 - 4,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.fillStyle =
        "rgba(255,255,255,.35)";


    ctx.beginPath();


    ctx.arc(
        centerX - 4,
        centerY - 4,
        3,
        0,
        Math.PI * 2
    );


    ctx.fill();

}


/* =========================================
   ЗМЕЙКА
========================================= */

function drawSnakePart(
    part,
    index
) {

    ctx.fillStyle =
        index === 0
            ? "#22c55e"
            : "#16a34a";


    const x =
        part.x * CELL_SIZE + 2;


    const y =
        part.y * CELL_SIZE + 2;


    const size =
        CELL_SIZE - 4;


    ctx.beginPath();


    if (
        typeof ctx.roundRect ===
        "function"
    ) {

        ctx.roundRect(
            x,
            y,
            size,
            size,
            5
        );

    } else {

        ctx.rect(
            x,
            y,
            size,
            size
        );

    }


    ctx.fill();


    if (index === 0) {

        drawSnakeEyes(part);

    }

}


/* =========================================
   ГЛАЗА
========================================= */

function drawSnakeEyes(part) {

    ctx.fillStyle =
        "white";


    const x =
        part.x * CELL_SIZE;


    const y =
        part.y * CELL_SIZE;


    let eye1;

    let eye2;


    if (direction === "left") {

        eye1 = {
            x: x + 7,
            y: y + 7
        };

        eye2 = {
            x: x + 7,
            y: y + 18
        };

    } else if (
        direction === "up"
    ) {

        eye1 = {
            x: x + 7,
            y: y + 7
        };

        eye2 = {
            x: x + 18,
            y: y + 7
        };

    } else if (
        direction === "down"
    ) {

        eye1 = {
            x: x + 7,
            y: y + 18
        };

        eye2 = {
            x: x + 18,
            y: y + 18
        };

    } else {

        eye1 = {
            x: x + 18,
            y: y + 7
        };

        eye2 = {
            x: x + 18,
            y: y + 18
        };

    }


    ctx.beginPath();

    ctx.arc(
        eye1.x,
        eye1.y,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        eye2.x,
        eye2.y,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================
   СТАРТОВЫЙ ЭКРАН
========================================= */

function drawStart() {

    ctx.fillStyle =
        "#111827";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.textAlign =
        "center";


    ctx.fillStyle =
        "#2563eb";


    ctx.font =
        "bold 40px Arial";


    ctx.fillText(
        "🐍 ЗМЕЙКА",
        canvas.width / 2,
        210
    );


    ctx.fillStyle =
        "white";


    ctx.font =
        "20px Arial";


    ctx.fillText(
        LEVELS[currentLevel].name,
        canvas.width / 2,
        250
    );


    ctx.fillStyle =
        "#94a3b8";


    ctx.font =
        "16px Arial";


    ctx.fillText(
        "Нажми «Начать»",
        canvas.width / 2,
        290
    );

}


/* =========================================
   КНОПКИ
========================================= */

startButton.addEventListener(
    "click",
    startGame
);


pauseButton.addEventListener(
    "click",
    togglePause
);


/* =========================================
   ЗАПУСК
========================================= */

updateRecords();


speedElement.textContent =
    LEVELS[currentLevel].name;


drawStart();

</script>
