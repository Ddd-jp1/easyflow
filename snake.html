<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EasyFlow — Змейка</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --blue: #2563eb;
    --dark: #111827;
    --green: #22c55e;
    --red: #ef4444;
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #111827;
    --muted: #64748b;
    --border: #e5e7eb;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
}

.header {
    max-width: 900px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: var(--blue);
    font-size: 27px;
    font-weight: bold;
    text-decoration: none;
}

.back {
    color: var(--blue);
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 30px 15px;
}

h1 {
    text-align: center;
    color: var(--blue);
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 25px;
}

/* Сложность */

.difficulty {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 15px;
    text-align: center;
}

.difficulty h2 {
    font-size: 18px;
    margin-bottom: 12px;
}

.levels {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.level {
    border: 2px solid var(--border);
    background: white;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.level.active {
    border-color: var(--blue);
    background: #dbeafe;
    color: #1d4ed8;
}

/* Статистика */

.info {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 20px;
    text-align: center;
    min-width: 110px;
}

.stat span {
    display: block;
    color: var(--muted);
    font-size: 13px;
}

.stat strong {
    font-size: 22px;
}

/* Игра */

.game-box {
    display: flex;
    justify-content: center;
}

canvas {
    width: min(92vw, 500px);
    height: min(92vw, 500px);

    background: #111827;

    border: 4px solid var(--blue);
    border-radius: 14px;

    display: block;

    touch-action: none;

    box-shadow: 0 12px 30px rgba(0,0,0,.15);
}

/* Сообщение */

.message {
    text-align: center;
    min-height: 24px;
    margin: 15px 0;
    font-weight: bold;
}

.error {
    color: var(--red);
}

.success {
    color: var(--green);
}

/* Кнопки */

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.main-button {
    border: none;
    background: var(--blue);
    color: white;

    padding: 12px 22px;
    border-radius: 10px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.main-button:hover {
    background: #1d4ed8;
}

.pause {
    background: #64748b;
}

.pause:hover {
    background: #475569;
}

/* Управление */

.controls {
    width: 210px;
    margin: 20px auto;

    display: grid;
    grid-template-columns: repeat(3, 65px);
    gap: 7px;
}

.control {
    width: 65px;
    height: 55px;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: white;

    font-size: 23px;
    cursor: pointer;

    touch-action: manipulation;
}

.control:active {
    background: #dbeafe;
}

.empty {
    visibility: hidden;
}

/* Рекорды */

.records {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;

    padding: 20px;
    margin-top: 20px;
}

.records h2 {
    text-align: center;
    margin-bottom: 15px;
}

.record {
    display: flex;
    justify-content: space-between;

    padding: 10px 5px;

    border-bottom: 1px solid var(--border);
}

.record:last-child {
    border-bottom: none;
}

footer {
    margin-top: 30px;
    background: #111827;
    color: #9ca3af;
    text-align: center;
    padding: 20px;
}

@media(max-width:600px) {

    .header {
        flex-direction: column;
        gap: 10px;
    }

    .container {
        padding: 25px 10px;
    }

    h1 {
        font-size: 30px;
    }

    .stat {
        min-width: 95px;
        padding: 9px 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">

        <a href="index.html" class="logo">
            EasyFlow
        </a>

        <a href="games.html" class="back">
            ← Все игры
        </a>

    </div>
</header>


<main class="container">

<h1>🐍 Змейка</h1>

<p class="subtitle">
    Собирай еду, увеличивай змейку и побей свой рекорд!
</p>


<!-- Сложность -->

<div class="difficulty">

    <h2>Сложность</h2>

    <div class="levels">

        <button
            class="level active"
            data-level="easy">
            🟢 Лёгкий
        </button>

        <button
            class="level"
            data-level="medium">
            🟡 Средний
        </button>

        <button
            class="level"
            data-level="hard">
            🔴 Сложный
        </button>

    </div>

</div>


<!-- Статистика -->

<div class="info">

    <div class="stat">
        <span>Очки</span>
        <strong id="score">0</strong>
    </div>

    <div class="stat">
        <span>🏆 Рекорд</span>
        <strong id="record">0</strong>
    </div>

    <div class="stat">
        <span>Скорость</span>
        <strong id="speed">Медленно</strong>
    </div>

</div>


<!-- Игровое поле -->

<div class="game-box">

    <canvas
        id="game"
        width="500"
        height="500">
    </canvas>

</div>


<div id="message" class="message">
    Нажми «Начать игру»
</div>


<!-- Основные кнопки -->

<div class="buttons">

    <button
        id="startButton"
        class="main-button">
        ▶️ Начать
    </button>

    <button
        id="pauseButton"
        class="main-button pause">
        ⏸️ Пауза
    </button>

</div>


<!-- Управление -->

<div class="controls">

    <button class="control empty"></button>

    <button
        class="control"
        data-direction="up">
        ⬆️
    </button>

    <button class="control empty"></button>


    <button
        class="control"
        data-direction="left">
        ⬅️
    </button>

    <button
        class="control"
        data-direction="down">
        ⬇️
    </button>

    <button
        class="control"
        data-direction="right">
        ➡️
    </button>

</div>


<!-- Рекорды -->

<div class="records">

    <h2>🏆 Рекорды</h2>

    <div class="record">
        <span>🟢 Лёгкий</span>
        <strong id="easyRecord">0</strong>
    </div>

    <div class="record">
        <span>🟡 Средний</span>
        <strong id="mediumRecord">0</strong>
    </div>

    <div class="record">
        <span>🔴 Сложный</span>
        <strong id="hardRecord">0</strong>
    </div>

</div>

</main>


<footer>
    © 2026 EasyFlow
</footer>


<script>

/* =========================
   НАСТРОЙКИ
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const SIZE = 25;
const CELL = canvas.width / SIZE;

const levels = {
    easy: {
        speed: 180,
        name: "Медленно"
    },

    medium: {
        speed: 120,
        name: "Средне"
    },

    hard: {
        speed: 75,
        name: "Быстро"
    }
};


/* =========================
   ПЕРЕМЕННЫЕ
========================= */

let snake = [];

let food = {
    x: 15,
    y: 15
};

let direction = "right";
let nextDirection = "right";

let score = 0;

let difficulty = "easy";

let timer = null;

let running = false;
let paused = false;


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const scoreElement =
    document.getElementById("score");

const recordElement =
    document.getElementById("record");

const speedElement =
    document.getElementById("speed");

const messageElement =
    document.getElementById("message");


/* =========================
   РЕКОРДЫ
========================= */

function getRecord(level) {

    return Number(
        localStorage.getItem(
            "easyflow_snake_" + level
        ) || 0
    );

}


function saveRecord(level, value) {

    localStorage.setItem(
        "easyflow_snake_" + level,
        value
    );

}


function updateRecords() {

    const easy =
        getRecord("easy");

    const medium =
        getRecord("medium");

    const hard =
        getRecord("hard");

    document.getElementById(
        "easyRecord"
    ).textContent = easy;

    document.getElementById(
        "mediumRecord"
    ).textContent = medium;

    document.getElementById(
        "hardRecord"
    ).textContent = hard;

    recordElement.textContent =
        getRecord(difficulty);
}


/* =========================
   СЛОЖНОСТЬ
========================= */

document
.querySelectorAll(".level")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            if (running) {

                messageElement.textContent =
                    "Сначала закончи игру.";

                return;
            }

            difficulty =
                button.dataset.level;

            document
            .querySelectorAll(".level")
            .forEach(b =>
                b.classList.remove("active")
            );

            button.classList.add("active");

            speedElement.textContent =
                levels[difficulty].name;

            updateRecords();

            drawStart();

        }
    );

});


/* =========================
   НАЧАЛО
========================= */

function startGame() {

    clearInterval(timer);

    snake = [
        {x: 12, y: 12},
        {x: 11, y: 12},
        {x: 10, y: 12}
    ];

    direction = "right";
    nextDirection = "right";

    score = 0;

    running = true;
    paused = false;

    scoreElement.textContent = "0";

    messageElement.textContent =
        "Игра началась!";

    messageElement.className =
        "message";

    createFood();

    draw();

    timer = setInterval(
        gameLoop,
        levels[difficulty].speed
    );
}


/* =========================
   ЕДА
========================= */

function createFood() {

    do {

        food = {
            x: Math.floor(
                Math.random() * SIZE
            ),

            y: Math.floor(
                Math.random() * SIZE
            )
        };

    } while (
        snake.some(part =>
            part.x === food.x &&
            part.y === food.y
        )
    );
}


/* =========================
   ИГРОВОЙ ЦИКЛ
========================= */

function gameLoop() {

    if (!running || paused) {
        return;
    }

    direction = nextDirection;

    const head = {
        x: snake[0].x,
        y: snake[0].y
    };


    if (direction === "up") {
        head.y--;
    }

    if (direction === "down") {
        head.y++;
    }

    if (direction === "left") {
        head.x--;
    }

    if (direction === "right") {
        head.x++;
    }


    /* Стена */

    if (
        head.x < 0 ||
        head.x >= SIZE ||
        head.y < 0 ||
        head.y >= SIZE
    ) {

        finishGame();

        return;
    }


    /* Столкновение с собой */

    const hitSelf =
        snake.some(part =>
            part.x === head.x &&
            part.y === head.y
        );

    if (hitSelf) {

        finishGame();

        return;
    }


    snake.unshift(head);


    /* Еда */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        scoreElement.textContent =
            score;


        if (
            score >
            getRecord(difficulty)
        ) {

            saveRecord(
                difficulty,
                score
            );

            updateRecords();
        }

        createFood();

    } else {

        snake.pop();

    }


    draw();
}


/* =========================
   УПРАВЛЕНИЕ
========================= */

function changeDirection(newDirection) {

    if (!running || paused) {
        return;
    }


    const opposite = {

        up: "down",
        down: "up",
        left: "right",
        right: "left"

    };


    if (
        newDirection !==
        opposite[direction]
    ) {

        nextDirection =
            newDirection;
    }
}


/* Кнопки телефона */

document
.querySelectorAll("[data-direction]")
.forEach(button => {

    button.addEventListener(
        "pointerdown",
        () => {

            changeDirection(
                button.dataset.direction
            );

        }
    );

});


/* =========================
   КЛАВИАТУРА
========================= */

document.addEventListener(
    "keydown",
    event => {

        const keys = {

            ArrowUp: "up",
            w: "up",

            ArrowDown: "down",
            s: "down",

            ArrowLeft: "left",
            a: "left",

            ArrowRight: "right",
            d: "right"

        };

        const key =
            event.key.length === 1
                ? event.key.toLowerCase()
                : event.key;

        if (keys[key]) {

            event.preventDefault();

            changeDirection(
                keys[key]
            );
        }


        if (
            event.key === " " ||
            event.key === "Escape"
        ) {

            event.preventDefault();

            togglePause();
        }

    }
);


/* =========================
   СВАЙПЫ НА ТЕЛЕФОНЕ
========================= */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    {passive: true}
);


canvas.addEventListener(
    "touchend",
    event => {

        const touch =
            event.changedTouches[0];

        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;


        if (
            Math.abs(dx) <
            20 &&
            Math.abs(dy) <
            20
        ) {
            return;
        }


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            changeDirection(
                dx > 0
                    ? "right"
                    : "left"
            );

        } else {

            changeDirection(
                dy > 0
                    ? "down"
                    : "up"
            );
        }

    },
    {passive: true}
);


/* =========================
   ПАУЗА
========================= */

function togglePause() {

    if (!running) {
        return;
    }

    paused = !paused;

    if (paused) {

        messageElement.textContent =
            "⏸️ Пауза";

    } else {

        messageElement.textContent =
            "▶️ Продолжаем!";

    }
}


/* =========================
   КОНЕЦ
========================= */

function finishGame() {

    clearInterval(timer);

    timer = null;

    running = false;
    paused = false;


    if (
        score >
        getRecord(difficulty)
    ) {

        saveRecord(
            difficulty,
            score
        );

        updateRecords();

        messageElement.textContent =
            "🏆 Новый рекорд: " +
            score;

        messageElement.className =
            "message success";

    } else {

        messageElement.textContent =
            "💥 Игра окончена! Очки: " +
            score;

        messageElement.className =
            "message error";
    }

    draw();
}


/* =========================
   РИСОВАНИЕ
========================= */

function draw() {

    /* Фон */

    ctx.fillStyle = "#111827";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Сетка */

    ctx.strokeStyle =
        "rgba(255,255,255,.04)";

    for (
        let i = 0;
        i <= SIZE;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i * CELL,
            0
        );

        ctx.lineTo(
            i * CELL,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i * CELL
        );

        ctx.lineTo(
            canvas.width,
            i * CELL
        );

        ctx.stroke();
    }


    /* Еда */

    ctx.fillStyle = "#ef4444";

    ctx.beginPath();

    ctx.arc(
        food.x * CELL + CELL / 2,
        food.y * CELL + CELL / 2,
        CELL / 2 - 4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Змейка */

    snake.forEach(
        (part, index) => {

            ctx.fillStyle =
                index === 0
                    ? "#22c55e"
                    : "#16a34a";

            ctx.beginPath();

            ctx.roundRect(
                part.x * CELL + 2,
                part.y * CELL + 2,
                CELL - 4,
                CELL - 4,
                5
            );

            ctx.fill();


            /* Глаза */

            if (index === 0) {

                ctx.fillStyle = "white";

                ctx.beginPath();

                ctx.arc(
                    part.x * CELL + 7,
                    part.y * CELL + 7,
                    3,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

                ctx.beginPath();

                ctx.arc(
                    part.x * CELL + 14,
                    part.y * CELL + 7,
                    3,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }

        }
    );
}


/* =========================
   СТАРТОВЫЙ ЭКРАН
========================= */

function drawStart() {

    ctx.fillStyle = "#111827";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.textAlign = "center";

    ctx.fillStyle = "#2563eb";

    ctx.font =
        "bold 40px Arial";

    ctx.fillText(
        "🐍 ЗМЕЙКА",
        canvas.width / 2,
        210
    );


    ctx.fillStyle = "white";

    ctx.font =
        "20px Arial";

    ctx.fillText(
        levels[difficulty].name,
        canvas.width / 2,
        250
    );


    ctx.fillStyle = "#94a3b8";

    ctx.font =
        "16px Arial";

    ctx.fillText(
        "Нажми «Начать»",
        canvas.width / 2,
        290
    );
}


/* =========================
   КНОПКА НАЧАТЬ
========================= */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);


/* =========================
   КНОПКА ПАУЗА
========================= */

document
.getElementById("pauseButton")
.addEventListener(
    "click",
    togglePause
);


/* =========================
   ЗАПУСК
========================= */

updateRecords();

speedElement.textContent =
    levels[difficulty].name;

drawStart();

</script>

</body>
</html>
