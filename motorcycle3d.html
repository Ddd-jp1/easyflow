<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>EasyFlow — Moto Ride</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --main: #2563eb;
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #111827;
    --muted: #64748b;
    --border: #e5e7eb;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

body.dark {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #334155;
}

header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 15px 5%;
}

.header {
    max-width: 1100px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: var(--main);
    font-size: 27px;
    font-weight: bold;
    text-decoration: none;
}

.back {
    color: var(--main);
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 15px;
}

.title {
    text-align: center;
    margin-bottom: 25px;
}

.title h1 {
    color: var(--main);
    font-size: 40px;
    margin-bottom: 8px;
}

.title p {
    color: var(--muted);
}

/* =========================
   ВАЛЮТА
========================= */

.money {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px 25px;
    text-align: center;
    margin-bottom: 20px;
}

.money strong {
    color: #f59e0b;
    font-size: 25px;
}

/* =========================
   МЕНЮ
========================= */

.menu {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
}

.menu h2 {
    text-align: center;
    margin-bottom: 15px;
}

.menu-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.menu-button {
    border: none;
    background: #e5e7eb;
    color: #111827;
    padding: 12px 18px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

.menu-button.active {
    background: var(--main);
    color: white;
}

/* =========================
   МОТОЦИКЛЫ
========================= */

.bikes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.bike {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    transition: .2s;
}

.bike:hover {
    transform: translateY(-3px);
}

.bike.selected {
    border-color: var(--main);
}

.bike-icon {
    font-size: 55px;
    margin-bottom: 8px;
}

.bike h3 {
    margin-bottom: 8px;
}

.bike-info {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 10px;
}

.buy {
    width: 100%;
    border: none;
    background: var(--main);
    color: white;
    padding: 10px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

.buy:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.locked {
    color: #ef4444;
    font-weight: bold;
}

/* =========================
   ИГРА
========================= */

.game-section {
    margin-top: 25px;
}

.game-box {
    position: relative;
    width: 100%;
    max-width: 700px;
    margin: auto;
}

canvas {
    display: block;
    width: 100%;
    height: auto;

    background: #70b7e8;

    border-radius: 18px;
    border: 4px solid var(--main);

    box-shadow: 0 15px 35px rgba(0,0,0,.2);

    touch-action: none;
}

.hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;

    display: flex;
    justify-content: space-between;

    color: white;
    font-weight: bold;

    pointer-events: none;
}

.hud span {
    background: rgba(0,0,0,.45);
    padding: 8px 12px;
    border-radius: 8px;
}

/* =========================
   УПРАВЛЕНИЕ
========================= */

.controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 15px;
}

.control {
    width: 90px;
    height: 60px;

    border: none;
    border-radius: 15px;

    background: var(--card);
    color: var(--text);

    border: 1px solid var(--border);

    font-size: 28px;
    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;
}

.control:active {
    background: #dbeafe;
}

/* =========================
   КНОПКИ
========================= */

.actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
}

.main-button {
    border: none;
    background: var(--main);
    color: white;

    padding: 13px 22px;
    border-radius: 11px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.main-button:hover {
    opacity: .9;
}

.message {
    text-align: center;
    min-height: 25px;
    margin-top: 15px;
    font-weight: bold;
}

/* =========================
   НАСТРОЙКИ
========================= */

.settings {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;

    padding: 20px;
    margin-top: 25px;
}

.settings h2 {
    text-align: center;
    margin-bottom: 18px;
}

.setting {
    margin-bottom: 18px;
}

.setting:last-child {
    margin-bottom: 0;
}

.setting-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.option {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);

    padding: 10px 15px;
    border-radius: 9px;

    cursor: pointer;
}

.option.active {
    background: var(--main);
    color: white;
    border-color: var(--main);
}

/* =========================
   MOBILE
========================= */

@media(max-width: 800px) {

    .bikes {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media(max-width: 500px) {

    .title h1 {
        font-size: 30px;
    }

    .bikes {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .bike {
        padding: 12px 8px;
    }

    .bike-icon {
        font-size: 42px;
    }

    .bike h3 {
        font-size: 15px;
    }

    .bike-info {
        font-size: 12px;
    }

    .control {
        width: 100px;
    }
}

footer {
    margin-top: 40px;
    background: #111827;
    color: #9ca3af;
    text-align: center;
    padding: 25px;
}
</style>
</head>

<body>

<header>

<div class="header">

<a href="index.html" class="logo">
EasyFlow
</a>

<a href="games.html" class="back">
← Игры
</a>

</div>

</header>


<main class="container">

<div class="title">

<h1>🏍️ Moto Ride</h1>

<p>
Зарабатывай монеты, покупай мотоциклы и проходи трассы!
</p>

</div>


<!-- ДЕНЬГИ -->

<div class="money">

💰 Монеты:

<strong id="coins">
0
</strong>

</div>


<!-- МОТОЦИКЛЫ -->

<div class="menu">

<h2>🏍️ Выбор мотоцикла</h2>

<div
id="bikes"
class="bikes">
</div>

</div>


<!-- ИГРА -->

<div class="game-section">

<div class="game-box">

<canvas
id="game"
width="700"
height="500">
</canvas>

<div class="hud">

<span>
💰 <b id="gameCoins">0</b>
</span>

<span>
🏍️ <b id="speedText">0</b> км/ч

</span>

<button
class="control"
id="leftButton">

<button

id="rightButton">
➡️
</button>

</div>

class="main-button"
onclick="startGame()">
▶️ Начать поездку
</button>

<button
class="main-button"
onclick="stopGame()">
⏹️ Остановиться
</button>

</div>


<div
id="message"
class="message">
Выбери мотоцикл и начинай поездку!
</div>

</div>


<!-- НАСТРОЙКИ -->

<div class="settings">

<h2>⚙️ Настройки</h2>


<div class="setting">

<div class="setting-title">
🎨 Графика
</div>

<div class="options">

<button
class="option active"
onclick="setGraphics('low', this)">
Низкая
</button>

<button
class="option"
onclick="setGraphics('medium', this)">
Средняя
</button>

<button
class="option"
onclick="setGraphics('high', this)">
Высокая
</button>

</div>

</div>


<div class="setting">

<div class="setting-title">
🌦️ Погода
</div>

<div class="options">

<button
class="option active"
onclick="setWeather('clear', this)">
☀️ Ясно
</button>

<button
class="option"
onclick="setWeather('rain', this)">
🌧️ Дождь
</button>

<button
class="option"
onclick="setWeather('snow', this)">
❄️ Снег
</button>

<button
class="option"
onclick="setWeather('fog', this)">
🌫️ Туман
</button>

</div>

</div>


<div class="setting">

<div class="setting-title">
🎮 Управление
</div>

<div class="options">

<button
class="option active"
onclick="setControl('buttons', this)">
⬅️ Кнопки ➡️
</button>

<button
class="option"
onclick="setControl('tilt', this)">
📱 Наклон телефона
</button>

</div>

</div>

</div>

</main>


<footer>

© 2026 EasyFlow — Moto Ride

</footer>


<script>

/* ==================================================
   МОТОЦИКЛЫ
================================================== */

const bikes = [

{
    name: "Street 50",
    icon: "🏍️",
    price: 0,
    speed: 5,
    color: "#2563eb"
},

{
    name: "Road 100",
    icon: "🏍️",
    price: 500,
    speed: 6,
    color: "#ef4444"
},

{
    name: "Speed X",
    icon: "🏍️",
    price: 1000,
    speed: 7,
    color: "#22c55e"
},

{
    name: "Racer",
    icon: "🏍️",
    price: 1500,
    speed: 8,
    color: "#f59e0b"
},

{
    name: "Thunder",
    icon: "🏍️",
    price: 2000,
    speed: 9,
    color: "#8b5cf6"
},

{
    name: "Shadow",
    icon: "🏍️",
    price: 2500,
    speed: 9,
    color: "#111827"
},

{
    name: "Fire",
    icon: "🏍️",
    price: 3000,
    speed: 10,
    color: "#dc2626"
},

{
    name: "Lightning",
    icon: "🏍️",
    price: 3500,
    speed: 10,
    color: "#eab308"
},

{
    name: "Storm",
    icon: "🏍️",
    price: 4000,
    speed: 11,
    color: "#64748b"
},

{
    name: "Phantom",
    icon: "🏍️",
    price: 4500,
    speed: 11,
    color: "#7c3aed"
},

{
    name: "Ninja",
    icon: "🏍️",
    price: 5000,
    speed: 12,
    color: "#111111"
},

{
    name: "Falcon",
    icon: "🏍️",
    price: 6000,
    speed: 12,
    color: "#0284c7"
},

{
    name: "Viper",
    icon: "🏍️",
    price: 7000,
    speed: 13,
    color: "#16a34a"
},

{
    name: "Turbo",
    icon: "🏍️",
    price: 8000,
    speed: 13,
    color: "#f97316"
},

{
    name: "Dragon",
    icon: "🏍️",
    price: 9000,
    speed: 14,
    color: "#b91c1c"
},

{
    name: "Titan",
    icon: "🏍️",
    price: 10000,
    speed: 14,
    color: "#475569"
},

{
    name: "Hyper",
    icon: "🏍️",
    price: 12000,
    speed: 15,
    color: "#9333ea"
},

{
    name: "Ultra",
    icon: "🏍️",
    price: 14000,
    speed: 16,
    color: "#0891b2"
},

{
    name: "Legend",
    icon: "🏍️",
    price: 17000,
    speed: 17,
    color: "#ca8a04"
},

{
    name: "Ultimate",
    icon: "🏍️",
    price: 20000,
    speed: 19,
    color: "#e11d48"
}

];


/* ==================================================
   СОСТОЯНИЕ
================================================== */

let coins =
    Number(
        localStorage.getItem(
            "easyflow_moto_coins"
        ) || 100
    );


let owned =
    JSON.parse(
        localStorage.getItem(
            "easyflow_moto_owned"
        ) || "[0]"
    );


let selectedBike =
    Number(
        localStorage.getItem(
            "easyflow_moto_selected"
        ) || 0
    );


let graphics = "low";

let weather = "clear";

let control = "buttons";

let running = false;

let animation = null;

let playerX = 350;

let roadOffset = 0;

let distance = 0;

let gameCoins = 0;

let speed = 0;

let leftPressed = false;

let rightPressed = false;

let obstacles = [];

let lastTime = 0;


/* ==================================================
   DOM
================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* ==================================================
   СОХРАНЕНИЕ
================================================== */

function saveData() {

    localStorage.setItem(
        "easyflow_moto_coins",
        coins
    );

    localStorage.setItem(
        "easyflow_moto_owned",
        JSON.stringify(owned)
    );

    localStorage.setItem(
        "easyflow_moto_selected",
        selectedBike
    );

}


/* ==================================================
   МОНЕТЫ
================================================== */

function updateCoins() {

    document.getElementById(
        "coins"
    ).textContent = coins;

    document.getElementById(
        "gameCoins"
    ).textContent = gameCoins;

}


/* ==================================================
   СПИСОК МОТОЦИКЛОВ
================================================== */

function renderBikes() {

    const box =
        document.getElementById("bikes");

    box.innerHTML = "";

    bikes.forEach(
        function(bike, index) {

            const card =
                document.createElement("div");

            card.className = "bike";

            if (index === selectedBike) {
                card.classList.add("selected");
            }


            let buttonText = "";

            let disabled = false;


            if (owned.includes(index)) {

                if (index === selectedBike) {

                    buttonText = "✅ Выбран";

                } else {

                    buttonText = "Выбрать";

                }

            } else {

                buttonText =
                    "💰 " + bike.price;

                if (coins < bike.price) {
                    disabled = true;
                }

            }


            card.innerHTML = `

                <div class="bike-icon">
                    ${bike.icon}
                </div>

                <h3>
                    ${bike.name}
                </h3>

                <div class="bike-info">

                    Скорость:
                    ${bike.speed}

                </div>

                <button
                    class="buy"
                    ${disabled ? "disabled" : ""}
                    onclick="selectBike(${index})">

                    ${buttonText}

                </button>

            `;


            box.appendChild(card);

        }
    );

}


/* ==================================================
   ВЫБОР / ПОКУПКА
================================================== */

function selectBike(index) {

    const bike =
        bikes[index];


    if (!owned.includes(index)) {

        if (coins < bike.price) {

            return;

        }

        coins -= bike.price;

        owned.push(index);

    }


    selectedBike = index;

    saveData();

    updateCoins();

    renderBikes();

    draw();

}


/* ==================================================
   ГРАФИКА
================================================== */

function setGraphics(level, button) {

    graphics = level;

    document
        .querySelectorAll(
            ".setting:nth-child(1) .option"
        )
        .forEach(
            b => b.classList.remove("active")
        );

    button.classList.add("active");

    draw();

}


/* ==================================================
   ПОГОДА
================================================== */

function setWeather(type, button) {

    weather = type;

    document
        .querySelectorAll(
            ".setting:nth-child(2) .option"
        )
        .forEach(
            b => b.classList.remove("active")
        );

    button.classList.add("active");

    draw();

}


/* ==================================================
   УПРАВЛЕНИЕ
================================================== */

function setControl(type, button) {

    control = type;

    document
        .querySelectorAll(
            ".setting:nth-child(3) .option"
        )
        .forEach(
            b => b.classList.remove("active")
        );

    button.classList.add("active");


    if (type === "tilt") {

        requestTiltPermission();

    }

}


/* ==================================================
   НАКЛОН ТЕЛЕФОНА
================================================== */

function requestTiltPermission() {

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&
        typeof DeviceOrientationEvent.requestPermission ===
        "function"
    ) {

        DeviceOrientationEvent
            .requestPermission()
            .then(
                function(permission) {

                    if (
                        permission !== "granted"
                    ) {

                        alert(
                            "Разреши доступ к датчикам телефона."
                        );

                    }

                }
            )
            .catch(
                function() {

                    alert(
                        "Не удалось получить доступ к гироскопу."
                    );

                }
            );

    }

}


/* ==================================================
   СЛУШАТЕЛЬ НАКЛОНА
================================================== */

window.addEventListener(
    "deviceorientation",
    function(event) {

        if (
            !running ||
            control !== "tilt"
        ) {

            return;

        }


        let gamma =
            event.gamma || 0;


        if (gamma < -8) {

            playerX -= 5;

        }


        if (gamma > 8) {

            playerX += 5;

        }

    }
);


/* ==================================================
   КНОПКИ
================================================== */

const leftButton =
    document.getElementById(
        "leftButton"
    );

const rightButton =
    document.getElementById(
        "rightButton"
    );


function pressLeft(e) {

    e.preventDefault();

    leftPressed = true;

}

function releaseLeft(e) {

    e.preventDefault();

    leftPressed = false;

}


function pressRight(e) {

    e.preventDefault();

    rightPressed = true;

}

function releaseRight(e) {

    e.preventDefault();

    rightPressed = false;

}


leftButton.addEventListener(
    "pointerdown",
    pressLeft
);

leftButton.addEventListener(
    "pointerup",
    releaseLeft
);

leftButton.addEventListener(
    "pointercancel",
    releaseLeft
);

leftButton.addEventListener(
    "pointerleave",
    releaseLeft
);


rightButton.addEventListener(
    "pointerdown",
    pressRight
);

rightButton.addEventListener(
    "pointerup",
    releaseRight
);

rightButton.addEventListener(
    "pointercancel",
    releaseRight
);

rightButton.addEventListener(
    "pointerleave",
    releaseRight
);


/* ==================================================
   КЛАВИАТУРА
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            leftPressed = true;

        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            rightPressed = true;

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            leftPressed = false;

        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            rightPressed = false;

        }

    }
);


/* ==================================================
   СТАРТ
================================================== */

function startGame() {

    if (running) {
        return;
    }


    running = true;

    distance = 0;

    gameCoins = 0;

    roadOffset = 0;

    playerX = 350;

    obstacles = [];

    speed = bikes[selectedBike].speed;


    document.getElementById(
        "message"
    ).textContent =
        "🏁 Поехали!";


    lastTime = performance.now();

    animation =
        requestAnimationFrame(
            gameLoop
        );

}


/* ==================================================
   ОСТАНОВКА
================================================== */

function stopGame() {

    running = false;

    cancelAnimationFrame(animation);


    coins += gameCoins;

    saveData();

    updateCoins();

    renderBikes();


    document.getElementById(
        "message"
    ).textContent =
        "🏁 Поездка окончена! Заработано: " +
        gameCoins +
        " 💰";


    draw();

}


/* ==================================================
   ИГРОВОЙ ЦИКЛ
================================================== */

function gameLoop(time) {

    if (!running) {
        return;
    }


    const delta =
        Math.min(
            (time - lastTime) / 16.67,
            2
        );


    lastTime = time;


    update(delta);

    draw();


    animation =
        requestAnimationFrame(
            gameLoop
        );

}


/* ==================================================
   ОБНОВЛЕНИЕ
================================================== */

function update(delta) {

    const bike =
        bikes[selectedBike];


    speed =
        bike.speed;


    roadOffset +=
        speed * delta * 2;


    distance +=
        speed * delta * 0.04;


    if (
        leftPressed &&
        control === "buttons"
    ) {

        playerX -=
            7 * delta;

    }


    if (
        rightPressed &&
        control === "buttons"
    ) {

        playerX +=
            7 * delta;

    }


    playerX =
        Math.max(
            210,
            Math.min(
                490,
                playerX
            )
        );


    /* Монеты */

    if (
        Math.floor(distance) % 10 === 0
    ) {

        if (
            Math.random() < 0.03
        ) {

            gameCoins++;

            updateCoins();

        }

    }


    /* Препятствия */

    if (
        Math.random() < 0.018 * delta
    ) {

        obstacles.push({

            x:
                210 +
                Math.random() * 280,

            y: -50,

            width: 45,

            height: 70

        });

    }


    obstacles.forEach(
        function(obstacle) {

            obstacle.y +=
                speed * delta * 2;

        }
    );


    obstacles =
        obstacles.filter(
            function(obstacle) {

                return obstacle.y <
                    canvas.height + 100;

            }
        );


    /* Столкновение */

    for (
        const obstacle of obstacles
    ) {

        if (

            playerX - 22 <
            obstacle.x +
            obstacle.width &&

            playerX + 22 >
            obstacle.x &&

            410 <
            obstacle.y +
            obstacle.height &&

            450 >
            obstacle.y

        ) {

            crash();

            return;

        }

    }


    document.getElementById(
        "speedText"
    ).textContent =
        speed * 12;


    document.getElementById(
        "distance"
    ).textContent =
        Math.floor(distance);

}


/* ==================================================
   АВАРИЯ
================================================== */

function crash() {

    running = false;

    cancelAnimationFrame(animation);


    coins += gameCoins;

    saveData();

    updateCoins();

    renderBikes();


    document.getElementById(
        "message"
    ).textContent =
        "💥 Авария! Ты заработал " +
        gameCoins +
        " 💰";


    draw();

}


/* ==================================================
   РИСОВАНИЕ
================================================== */

function draw() {

    const w = canvas.width;
    const h = canvas.height;


    /* Небо */

    let sky =
        "#70b7e8";


    if (weather === "rain") {
        sky = "#64748b";
    }

    if (weather === "snow") {
        sky = "#cbd5e1";
    }

    if (weather === "fog") {
        sky = "#94a3b8";
    }


    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /* Деревья / трава */

    ctx.fillStyle =
        weather === "snow"
        ? "#e2e8f0"
        : "#4ade80";

    ctx.fillRect(
        0,
        0,
        190,
        h
    );

    ctx.fillRect(
        510,
        0,
        190,
        h
    );


    /* Дорога */

    ctx.fillStyle =
        "#333333";

    ctx.fillRect(
        190,
        0,
        320,
        h
    );


    /* Края дороги */

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        195,
        0,
        6,
        h
    );

    ctx.fillRect(
        499,
        0,
        6,
        h
    );


    /* Разметка */

    ctx.fillStyle =
        "#f8fafc";


    const lineHeight = 50;

    const gap = 40;


    for (
        let y =
            -lineHeight +
            (roadOffset %
                (lineHeight + gap));

        y < h;

        y +=
            lineHeight + gap
    ) {

        ctx.fillRect(
            348,
            y,
            5,
            lineHeight
        );

    }


    /* Препятствия */

    obstacles.forEach(
        function(obstacle) {

            ctx.fillStyle =
                "#dc2626";

            ctx.fillRect(
                obstacle.x,
                obstacle.y,
                obstacle.width,
                obstacle.height
            );


            ctx.fillStyle =
                "#facc15";

            ctx.fillRect(
                obstacle.x + 5,
                obstacle.y + 8,
                obstacle.width - 10,
                10
            );

        }
    );


    /* Мотоцикл */

    drawMotorcycle(
        playerX,
        430,
        bikes[selectedBike].color
    );


    /* Погода */

    drawWeather();

}


/* ==================================================
   МОТОЦИКЛ
================================================== */

function drawMotorcycle(
    x,
    y,
    color
) {

    /* Тень */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 25,
        32,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Колёса */

    ctx.fillStyle =
        "#111827";


    ctx.beginPath();

    ctx.arc(
        x,
        y + 15,
        13,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x,
        y - 30,
        13,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Корпус */

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.roundRect(
        x - 16,
        y - 30,
        32,
        50,
        8
    );

    ctx.fill();


    /* Фара */

    ctx.fillStyle =
        "#fef08a";

    ctx.beginPath();

    ctx.arc(
        x,
        y - 32,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Водитель */

    ctx.fillStyle =
        "#111827";

    ctx.beginPath();

    ctx.arc(
        x,
        y - 52,
        10,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* ==================================================
   ПОГОДА
================================================== */

function drawWeather() {

    if (weather === "clear") {
        return;
    }


    if (weather === "rain") {

        ctx.strokeStyle =
            "rgba(255,255,255,.5)";

        ctx.lineWidth = 2;


        for (
            let i = 0;
            i < 80;
            i++
        ) {

            const x =
                Math.random() *
                canvas.width;

            const y =
                Math.random() *
                canvas.height;

            ctx.beginPath();

            ctx.moveTo(
                x,
                y
            );

            ctx.lineTo(
                x - 5,
                y + 15
            );

            ctx.stroke();

        }

    }


    if (weather === "snow") {

        ctx.fillStyle =
            "rgba(255,255,255,.8)";


        for (
            let i = 0;
            i < 60;
            i++
        ) {

            const x =
                Math.random() *
                canvas.width;

            const y =
                Math.random() *
                canvas.height;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

    }


    if (weather === "fog") {

        ctx.fillStyle =
            "rgba(255,255,255,.35)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

}


/* ==================================================
   НАСТРОЙКИ EASYFLOW
================================================== */

function loadEasyFlowSettings() {

    const color =
        localStorage.getItem(
            "easyflow_color"
        );

    if (color) {

        document.documentElement
            .style
            .setProperty(
                "--main",
                color
            );

    }


    const font =
        localStorage.getItem(
            "easyflow_font"
        );

    if (font) {

        document.body.style.fontFamily =
            font;

    }


    const radius =
        localStorage.getItem(
            "easyflow_radius"
        );

    if (radius) {

        document.documentElement
            .style
            .setProperty(
                "--radius",
                radius
            );

    }


    const theme =
        localStorage.getItem(
            "easyflow_theme"
        );

    if (theme === "dark") {

        document.body.classList.add(
            "dark"
        );

    }

}


/* ==================================================
   ЗАПУСК
================================================== */

loadEasyFlowSettings();

updateCoins();

renderBikes();

draw();

</script>
