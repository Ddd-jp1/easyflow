<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyFlow — Вход</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#111827;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.1);
    border:1px solid #e5e7eb;
}

.logo{
    text-align:center;
    color:#2563eb;
    font-size:30px;
    font-weight:bold;
    margin-bottom:25px;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #e5e7eb;
    border-radius:12px;
    margin-bottom:14px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    border:0;
    background:#2563eb;
    color:white;
    padding:14px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.message{
    text-align:center;
    margin-top:15px;
    min-height:22px;
    font-weight:bold;
}

.error{
    color:#dc2626;
}

.success{
    color:#16a34a;
}

.register{
    text-align:center;
    margin-top:20px;
    color:#64748b;
}

.register a{
    color:#2563eb;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">EasyFlow</div>

    <h1>🔐 Вход</h1>

    <input
        id="loginName"
        type="text"
        placeholder="Имя"
        autocomplete="username"
    >

    <input
        id="loginPassword"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
    >

    <button onclick="login()">
        Войти
    </button>

    <div id="message" class="message"></div>

    <div class="register">
        Нет аккаунта?
        <a href="register.html">Регистрация</a>
    </div>

</div>

<script>

const ADMIN_NAME = "Admin";
const ADMIN_PASSWORD = "080810";

function getUsers(){

    try{

        return JSON.parse(
            localStorage.getItem("easyflow_users")
        ) || [];

    }catch(error){

        return [];

    }

}

function saveUsers(users){

    localStorage.setItem(
        "easyflow_users",
        JSON.stringify(users)
    );

}

function login(){

    const name =
        document.getElementById(
            "loginName"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    const message =
        document.getElementById(
            "message"
        );

    message.className="message";

    if(!name || !password){

        message.textContent=
            "Введите имя и пароль";

        message.classList.add("error");

        return;

    }

    /*
       ADMIN
       Имя: Admin
       Пароль: 080810
    */

    if(
        name.toLowerCase() ===
        ADMIN_NAME.toLowerCase() &&
        password === ADMIN_PASSWORD
    ){

        const adminUser={
            name:"Admin",
            role:"admin"
        };

        localStorage.setItem(
            "easyflow_current_user",
            JSON.stringify(adminUser)
        );

        message.textContent=
            "✅ Вход выполнен!";

        message.classList.add("success");

        setTimeout(()=>{

            window.location.href=
                "admin.html";

        },500);

        return;

    }

    const users=getUsers();

    const user=users.find(
        u =>
            u.name.toLowerCase() ===
            name.toLowerCase() &&
            u.password === password
    );

    if(!user){

        message.textContent=
            "❌ Неверное имя или пароль";

        message.classList.add("error");

        return;

    }

    localStorage.setItem(
        "easyflow_current_user",
        JSON.stringify({
            name:user.name,
            role:user.role
        })
    );

    message.textContent=
        "✅ Вход выполнен!";

    message.classList.add("success");

    setTimeout(()=>{

        window.location.href=
            "index.html";

    },500);

}

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter")
            login();

    }
);

</script>

</body>
</html>
