<!DOCTYPE html>
<html lang="ru">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EasyFlow — Угадай флаг</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #111827;
    min-height: 100vh;
}

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 18px 6%;
}

.header {
    max-width: 900px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #2563eb;
    font-size: 27px;
    font-weight: bold;
    text-decoration: none;
}

.back {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 35px 20px;
}

.title {
    text-align: center;
    margin-bottom: 25px;
}

.title h1 {
    font-size: 40px;
    color: #2563eb;
    margin-bottom: 8px;
}

.title p {
    color: #64748b;
}

/* СЛОЖНОСТЬ */

.difficulty {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 20px;
    border: 1px solid #e5e7eb;
    text-align: center;
}

.difficulty h2 {
    margin-bottom: 15px;
}

.levels {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.level {
    border: 2px solid #e5e7eb;
    background: white;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

.level:hover {
    transform: translateY(-2px);
}

.level.active.easy {
    border-color: #22c55e;
    background: #dcfce7;
    color: #166534;
}

.level.active.medium {
    border-color: #eab308;
    background: #fef9c3;
    color: #854d0e;
}

.level.active.hard {
    border-color: #ef4444;
    background: #fee2e2;
    color: #991b1b;
}

/* СТАТИСТИКА */

.info {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.stat {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px 25px;
    text-align: center;
    min-width: 130px;
}

.stat span {
    display: block;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 5px;
}

.stat strong {
    font-size: 23px;
}

/* ИГРА */

.game-box {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.08);
}

.flag-wrapper {
    width: 100%;
    max-width: 520px;
    height: 300px;
    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f8fafc;
    border-radius: 16px;
    border: 2px solid #e5e7eb;
    overflow: hidden;
}

#flag {
    max-width: 90%;
    max-height: 85%;
    width: auto;
    height: auto;

    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.question {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* ВАРИАНТЫ */

.answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;

    max-width: 600px;
    margin: auto;
}

.answer {
    border: 2px solid #e5e7eb;
    background: white;
    color: #111827;

    padding: 15px 12px;
    border-radius: 12px;

    cursor: pointer;

    font-size: 17px;
    font-weight: bold;

    transition: 0.2s;
}

.answer:hover:not(:disabled) {
    border-color: #2563eb;
    background: #eff6ff;
    transform: translateY(-2px);
}

.answer:disabled {
    cursor: default;
}

.answer.correct {
    background: #dcfce7;
    border-color: #22c55e;
    color: #166534;
}

.answer.wrong {
    background: #fee2e2;
    border-color: #ef4444;
    color: #991b1b;
}

/* СООБЩЕНИЕ */

.message {
    min-height: 28px;
    margin: 20px 0;

    text-align: center;

    font-weight: bold;
    font-size: 18px;
}

.message.correct-message {
    color: #16a34a;
}

.message.wrong-message {
    color: #dc2626;
}

.message.win-message {
    color: #2563eb;
}

/* КНОПКИ */

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.main-button {
    border: none;
    background: #2563eb;
    color: white;

    padding: 13px 22px;

    border-radius: 11px;

    cursor: pointer;

    font-weight: bold;
    font-size: 16px;

    transition: 0.2s;
}

.main-button:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
}

.next-button {
    display: none;
}

/* СЧЁТЧИК */

.progress {
    margin-top: 15px;
    color: #64748b;
    font-size: 14px;
}

/* РЕКОРДЫ */

.records {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 18px;

    padding: 25px;

    margin-top: 30px;
}

.records h2 {
    text-align: center;
    margin-bottom: 20px;
}

.record-row {
    display: flex;
    justify-content: space-between;

    padding: 12px 5px;

    border-bottom: 1px solid #eef0f3;
}

.record-row:last-child {
    border-bottom: none;
}

footer {
    margin-top: 40px;
    background: #111827;
    color: #9ca3af;
    text-align: center;
    padding: 25px;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media(max-width: 600px) {

    .title h1 {
        font-size: 32px;
    }

    .container {
        padding: 25px 12px;
    }

    .game-box {
        padding: 18px;
    }

    .flag-wrapper {
        height: 210px;
    }

    .answers {
        grid-template-columns: 1fr;
    }

    .stat {
        min-width: 100px;
        padding: 12px 15px;
    }

    .level {
        width: 100%;
    }

}
</style>
</head>

</main>

===================================================== */

let difficulty = "easy";

let currentCountry = null;

let score = 0;

let lives = 3;

let gameRunning = false;

let questionAnswered = false;

let usedCountries = [];


/* =====================================================
   DOM
===================================================== */

const flagElement =
    document.getElementById("flag");

const answersElement =
    document.getElementById("answers");

const scoreElement =
    document.getElementById("score");

const livesElement =
    document.getElementById("lives");

const recordElement =
    document.getElementById("record");

const messageElement =
    document.getElementById("message");

const nextButton =
    document.getElementById("nextButton");

const progressElement =
    document.getElementById("progress");


/* =====================================================
   РЕКОРДЫ
===================================================== */

function getRecord(level) {

    return Number(
        localStorage.getItem(
            "easyflow_flags_record_" + level
        ) || 0
    );

}


function saveRecord(level, value) {

    localStorage.setItem(
        "easyflow_flags_record_" + level,
        value
    );

}


function updateRecords() {

    document.getElementById(
        "easyRecord"
    ).textContent =
        getRecord("easy");


    document.getElementById(
        "mediumRecord"
    ).textContent =
        getRecord("medium");


    document.getElementById(
        "hardRecord"
    ).textContent =
        getRecord("hard");


    recordElement.textContent =
        getRecord(difficulty);

}


/* =====================================================
   ВЫБОР СЛОЖНОСТИ
===================================================== */

function selectDifficulty(level) {

    if (gameRunning) {

        alert(
            "Сначала закончи текущую игру."
        );

        return;

    }


    difficulty = level;


    document
        .querySelectorAll(".level")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    document
        .getElementById(
            level + "Button"
        )
        .classList.add("active");


    updateRecords();

    resetScreen();

}


/* =====================================================
   ПЕРЕМЕШИВАНИЕ
===================================================== */

function shuffle(array) {

    const result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }

    return result;

}


/* =====================================================
   НАЧАЛО ИГРЫ
===================================================== */

function startGame() {

    score = 0;

    lives = 3;

    gameRunning = true;

    questionAnswered = false;

    usedCountries = [];


    scoreElement.textContent = "0";

    livesElement.textContent = "3";


    messageElement.textContent =
        "Выбери правильную страну!";

    messageElement.className =
        "message";


    nextButton.style.display =
        "none";


    nextQuestion();

}


/* =====================================================
   СЛЕДУЮЩИЙ ВОПРОС
===================================================== */

function nextQuestion() {

    if (!gameRunning) {
        return;
    }


    questionAnswered = false;


    nextButton.style.display =
        "none";


    const available =
        uniqueCountries.filter(
            function(country) {

                return (
                    country.difficulty ===
                    difficulty
                );

            }
        );


    /*
       Если все страны уровня уже использованы,
       начинаем новый круг.
    */

    let unused =
        available.filter(
            function(country) {

                return !usedCountries.includes(
                    country.code
                );

            }
        );


    if (unused.length === 0) {

        usedCountries = [];

        unused = [...available];

    }


    const randomIndex =
        Math.floor(
            Math.random() * unused.length
        );


    currentCountry =
        unused[randomIndex];


    usedCountries.push(
        currentCountry.code
    );


    /* Флаг */

    flagElement.src =
        "https://flagcdn.com/w640/" +
        currentCountry.code +
        ".png";


    flagElement.alt =
        "Флаг " +
        currentCountry.name;


    createAnswers(available);


    updateProgress();

}


/* =====================================================
   СОЗДАНИЕ ОТВЕТОВ
===================================================== */

function createAnswers(available) {

    answersElement.innerHTML = "";


    let options = [
        currentCountry
    ];


    const wrongAnswers =
        shuffle(
            available.filter(
                function(country) {

                    return (
                        country.code !==
                        currentCountry.code
                    );

                }
            )
        );


    /*
       Всегда 4 варианта ответа.
    */

    while (
        options.length < 4 &&
        wrongAnswers.length > 0
    ) {

        options.push(
            wrongAnswers.shift()
        );

    }


    options =
        shuffle(options);


    options.forEach(
        function(country) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.textContent =
                country.name;


            button.type =
                "button";


            button.onclick =
                function() {

                    checkAnswer(
                        country,
                        button
                    );

                };


            answersElement.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   ПРОВЕРКА ОТВЕТА
===================================================== */

function checkAnswer(
    country,
    button
) {

    if (
        !gameRunning ||
        questionAnswered
    ) {

        return;

    }


    questionAnswered = true;


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(
        function(btn) {

            btn.disabled = true;

        }
    );


    /* ПРАВИЛЬНО */

    if (
        country.code ===
        currentCountry.code
    ) {

        button.classList.add(
            "correct"
        );


        score++;


        scoreElement.textContent =
            score;


        messageElement.textContent =
            "✅ Правильно!";


        messageElement.className =
            "message correct-message";


        updateBestScore();


        nextButton.style.display =
            "inline-block";


        updateProgress();


        return;

    }


    /* НЕПРАВИЛЬНО */

    button.classList.add(
        "wrong"
    );


    buttons.forEach(
        function(btn) {

            if (
                btn.textContent ===
                currentCountry.name
            ) {

                btn.classList.add(
                    "correct"
                );

            }

        }
    );


    lives--;


    livesElement.textContent =
        lives;


    messageElement.textContent =
        "❌ Неправильно! Правильный ответ: " +
        currentCountry.name;


    messageElement.className =
        "message wrong-message";


    if (lives <= 0) {

        endGame();

    } else {

        nextButton.style.display =
            "inline-block";

    }


    updateProgress();

}


/* =====================================================
   РЕКОРД
===================================================== */

function updateBestScore() {

    const record =
        getRecord(difficulty);


    if (score > record) {

        saveRecord(
            difficulty,
            score
        );

        updateRecords();

    }

}


/* =====================================================
   ПРОГРЕСС
===================================================== */

function updateProgress() {

    const total =
        uniqueCountries.filter(
            function(country) {

                return (
                    country.difficulty ===
                    difficulty
                );

            }
        ).length;


    const used =
        usedCountries.length;


    progressElement.textContent =
        "🌍 Стран в уровне: " +
        total +
        " • Пройдено: " +
        used;

}


/* =====================================================
   КОНЕЦ ИГРЫ
===================================================== */

function endGame() {

    gameRunning = false;

    updateBestScore();


    messageElement.textContent =
        "💥 Игра окончена! Твой результат: " +
        score +
        " очков";


    messageElement.className =
        "message wrong-message";


    nextButton.style.display =
        "none";


    document
        .querySelectorAll(".answer")
        .forEach(
            function(button) {

                button.disabled = true;

            }
        );

}


/* =====================================================
   СБРОС
===================================================== */

function resetScreen() {

    score = 0;

    lives = 3;

    gameRunning = false;

    questionAnswered = false;

    currentCountry = null;

    usedCountries = [];


    scoreElement.textContent =
        "0";


    livesElement.textContent =
        "3";


    messageElement.textContent =
        "Нажми «Начать игру»";


    messageElement.className =
        "message";


    flagElement.removeAttribute(
        "src"
    );


    flagElement.alt =
        "Флаг";


    answersElement.innerHTML =
        "";


    nextButton.style.display =
        "none";


    progressElement.textContent =
        "";


    updateRecords();

}


/* =====================================================
   КЛАВИАТУРА
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            !gameRunning ||
            questionAnswered
        ) {
            return;
        }


        const buttons =
            document.querySelectorAll(
                ".answer"
            );


        /*
           Клавиши 1,2,3,4
           выбирают ответ.
        */

        if (
            ["1","2","3","4"]
            .includes(event.key)
        ) {

            const index =
                Number(event.key) - 1;


            if (buttons[index]) {

                buttons[index].click();

            }

        }

    }
);


/* =====================================================
   ЗАПУСК
===================================================== */

updateRecords();

resetScreen();

</script>

</body>
</html>
