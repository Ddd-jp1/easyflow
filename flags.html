<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #111827;
    min-height: 100vh;
}

header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    padding: 18px 6%;
}

.header {
    max-width: 900px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #2563eb;
    font-size: 27px;
    font-weight: bold;
    text-decoration: none;
}

.back {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 35px 20px;
}

.title {
    text-align: center;
    margin-bottom: 25px;
}

.title h1 {
    font-size: 40px;
    color: #2563eb;
    margin-bottom: 8px;
}

.title p {
    color: #64748b;
}

/* =========================
   СЛОЖНОСТЬ
========================= */

.difficulty {
    background: #fff;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 20px;
    border: 1px solid #e5e7eb;
    text-align: center;
}

.difficulty h2 {
    margin-bottom: 15px;
}

.levels {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.level {
    border: 2px solid #e5e7eb;
    background: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

.level:hover {
    transform: translateY(-2px);
}

.level.active.easy {
    border-color: #22c55e;
    background: #dcfce7;
    color: #166534;
}

.level.active.medium {
    border-color: #eab308;
    background: #fef9c3;
    color: #854d0e;
}

.level.active.hard {
    border-color: #ef4444;
    background: #fee2e2;
    color: #991b1b;
}

/* =========================
   СТАТИСТИКА
========================= */

.info {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.stat {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px 25px;
    text-align: center;
    min-width: 130px;
}

.stat span {
    display: block;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 5px;
}

.stat strong {
    font-size: 23px;
}

/* =========================
   ИГРА
========================= */

.game-box {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,.08);
}

.flag-wrapper {
    width: 100%;
    max-width: 520px;
    height: 300px;
    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f8fafc;
    border-radius: 16px;
    border: 2px solid #e5e7eb;
    overflow: hidden;
}

#flag {
    max-width: 90%;
    max-height: 85%;
    width: auto;
    height: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,.15);
}

.question {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* =========================
   ОТВЕТЫ
========================= */

.answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 600px;
    margin: auto;
}

.answer {
    border: 2px solid #e5e7eb;
    background: #fff;
    color: #111827;

    padding: 15px 12px;
    border-radius: 12px;

    cursor: pointer;

    font-size: 17px;
    font-weight: bold;

    transition: .2s;
}

.answer:hover:not(:disabled) {
    border-color: #2563eb;
    background: #eff6ff;
    transform: translateY(-2px);
}

.answer:disabled {
    cursor: default;
}

.answer.correct {
    background: #dcfce7;
    border-color: #22c55e;
    color: #166534;
}

.answer.wrong {
    background: #fee2e2;
    border-color: #ef4444;
    color: #991b1b;
}

/* =========================
   СООБЩЕНИЕ
========================= */

.message {
    min-height: 28px;
    margin: 20px 0;
    text-align: center;
    font-weight: bold;
    font-size: 18px;
}

.correct-message {
    color: #16a34a;
}

.wrong-message {
    color: #dc2626;
}

.win-message {
    color: #2563eb;
}

/* =========================
   КНОПКИ
========================= */

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.main-button {
    border: none;
    background: #2563eb;
    color: #fff;

    padding: 13px 22px;
    border-radius: 11px;

    cursor: pointer;

    font-weight: bold;
    font-size: 16px;

    transition: .2s;
}

.main-button:hover:not(:disabled) {
    background: #1d4ed8;
    transform: translateY(-2px);
}

.main-button:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}

.next-button {
    display: none;
}

/* =========================
   ПРОГРЕСС
========================= */

.progress {
    margin-top: 15px;
    color: #64748b;
    font-size: 14px;
}

/* =========================
   РЕКОРДЫ
========================= */

.records {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 25px;
    margin-top: 30px;
}

.records h2 {
    text-align: center;
    margin-bottom: 20px;
}

.record-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 5px;
    border-bottom: 1px solid #eef0f3;
}

.record-row:last-child {
    border-bottom: none;
}

footer {
    margin-top: 40px;
    background: #111827;
    color: #9ca3af;
    text-align: center;
    padding: 25px;
}

/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
========================= */

@media (max-width: 600px) {

    .title h1 {
        font-size: 32px;
    }

    .container {
        padding: 25px 12px;

    }

    }

    .stat {
        min-width: 100px;
        padding: 12px 15px;
    }

    .level {
        width: 100%;
    }
}
</style>
</head>

const uniqueCountries = [];
const countryCodes = new Set();

countries.forEach(country => {

    if (!countryCodes.has(country.code)) {

        countryCodes.add(country.code);

        uniqueCountries.push(country);

    }

});


/* =====================================================
   НАСТРОЙКИ
===================================================== */

let difficulty = "easy";

let currentCountry = null;

let score = 0;

let lives = 3;

let gameRunning = false;

let questionAnswered = false;

/*
   Здесь хранятся ВСЕ флаги,
   которые уже были показаны
   в текущей игре.
*/
let usedCountries = [];


/* =====================================================
   DOM
===================================================== */

const flagElement =
    document.getElementById("flag");

const answersElement =
    document.getElementById("answers");

const scoreElement =
    document.getElementById("score");

const livesElement =
    document.getElementById("lives");

const recordElement =
    document.getElementById("record");

const messageElement =
    document.getElementById("message");

const nextButton =
    document.getElementById("nextButton");

const startButton =
    document.getElementById("startButton");

const progressElement =
    document.getElementById("progress");


/* =====================================================
   РЕКОРДЫ
===================================================== */

function getRecord(level) {

    return Number(
        localStorage.getItem(
            "easyflow_flags_record_" + level
        ) || 0
    );

}


function saveRecord(level, value) {

    localStorage.setItem(
        "easyflow_flags_record_" + level,
        String(value)
    );

}


function updateRecords() {

    document.getElementById("easyRecord").textContent =
        getRecord("easy");

    document.getElementById("mediumRecord").textContent =
        getRecord("medium");

    document.getElementById("hardRecord").textContent =
        getRecord("hard");

    recordElement.textContent =
        getRecord(difficulty);

}


/* =====================================================
   ВЫБОР СЛОЖНОСТИ
===================================================== */

function selectDifficulty(level) {

    /*
       Меняем уровень сразу.
       Текущая игра сбрасывается,
       чтобы флаги нового уровня
       никогда не смешивались со старым.
    */

    difficulty = level;

    updateDifficultyButtons();

    resetScreen();

    messageElement.textContent =
        "Выбран уровень: " +
        getDifficultyName();

    messageElement.className =
        "message";

}


/* =====================================================
   НАЗВАНИЕ УРОВНЯ
===================================================== */

function getDifficultyName() {

    if (difficulty === "easy") {
        return "🟢 Лёгкий";
    }

    if (difficulty === "medium") {
        return "🟡 Средний";
    }

    if (difficulty === "hard") {
        return "🔴 Сложный";
    }

    return "";

}


/* =====================================================
   АКТИВНАЯ КНОПКА
===================================================== */

function updateDifficultyButtons() {

    document
        .querySelectorAll(".level")
        .forEach(button => {

            button.classList.remove("active");

        });


    const activeButton =
        document.getElementById(
            difficulty + "Button"
        );


    if (activeButton) {

        activeButton.classList.add(
            "active",
            difficulty
        );

    }

}


/* =====================================================
   ПЕРЕМЕШИВАНИЕ
===================================================== */

function shuffle(array) {

    const result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];

    }

    return result;

}


/* =====================================================
   СТРАНЫ ТЕКУЩЕГО УРОВНЯ
===================================================== */

function getAvailableCountries() {

    /*
       ВАЖНО:

       Здесь строго проверяется difficulty.

       easy    → только easy
       medium  → только medium
       hard    → только hard
    */

    return uniqueCountries.filter(
        country =>
            country.difficulty === difficulty
    );

}


/* =====================================================
   НАЧАЛО ИГРЫ
===================================================== */

function startGame() {

    const available =
        getAvailableCountries();


    if (available.length < 4) {

        messageElement.textContent =
            "❌ На этом уровне недостаточно стран.";

        messageElement.className =
            "message wrong-message";

        return;

    }


    score = 0;

    lives = 3;

    gameRunning = true;

    questionAnswered = false;


    /*
       Полностью очищаем список
       использованных флагов.
    */

    usedCountries = [];


    scoreElement.textContent =
        "0";

    livesElement.textContent =
        "3";


    messageElement.textContent =
        "Выбери правильную страну!";

    messageElement.className =
        "message";


    nextButton.style.display =
        "none";


    startButton.textContent =
        "🔄 Новая игра";


    nextQuestion();

}


/* =====================================================
   СЛЕДУЮЩИЙ ВОПРОС
===================================================== */

function nextQuestion() {

    if (!gameRunning) {
        return;
    }


    const available =
        getAvailableCountries();


    /*
       Если все страны уже использованы,
       игра заканчивается.
    */

    const unused =
        available.filter(
            country =>
                !usedCountries.includes(
                    country.code
                )
        );


    if (unused.length === 0) {

        finishLevel();

        return;

    }


    questionAnswered = false;

    nextButton.style.display =
        "none";


    /*
       Выбираем флаг ТОЛЬКО
       из ещё не использованных.
    */

    currentCountry =
        unused[
            Math.floor(
                Math.random() *
                unused.length
            )
        ];


    /*
       Сразу записываем флаг
       в использованные.

       Поэтому этот же флаг
       больше никогда не появится
       в текущей игре.
    */

    usedCountries.push(
        currentCountry.code
    );


    /* =========================
       ФЛАГ
    ========================== */

    flagElement.src =
        "https://flagcdn.com/w640/" +
        currentCountry.code +
        ".png";

    flagElement.alt =
        "Флаг " +
        currentCountry.name;


    /* =========================
       ОТВЕТЫ
    ========================== */

    createAnswers(available);


    updateProgress();

}


/* =====================================================
   СОЗДАНИЕ ОТВЕТОВ
===================================================== */

function createAnswers(available) {

    answersElement.innerHTML = "";


    /*
       Берём только страны
       ТОГО ЖЕ УРОВНЯ.
    */

    const wrongAnswers =
        shuffle(
            available.filter(
                country =>
                    country.code !==
                    currentCountry.code
            )
        );


    /*
       1 правильный +
       3 неправильных.
    */

    const options = [
        currentCountry,
        ...wrongAnswers.slice(0, 3)
    ];


    const shuffledOptions =
        shuffle(options);


    shuffledOptions.forEach(
        (country, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";

            button.type =
                "button";


            button.textContent =
                country.name;


            /*
               Можно отвечать
               и мышкой,
               и клавишами 1-4.
            */

            button.dataset.index =
                index + 1;


            button.addEventListener(
                "click",
                () =>
                    checkAnswer(
                        country,
                        button
                    )
            );


            answersElement.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   ПРОВЕРКА ОТВЕТА
===================================================== */

function checkAnswer(
    country,
    button
) {

    if (
        !gameRunning ||
        questionAnswered
    ) {
        return;
    }


    questionAnswered = true;


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(
        btn => {
            btn.disabled = true;
        }
    );


    /* =========================
       ПРАВИЛЬНО
    ========================== */

    if (
        country.code ===
        currentCountry.code
    ) {

        button.classList.add(
            "correct"
        );


        score++;


        scoreElement.textContent =
            score;


        messageElement.textContent =
            "✅ Правильно!";


        messageElement.className =
            "message correct-message";


        updateBestScore();


        /*
           Проверяем, закончились ли
           страны после правильного ответа.
        */

        const available =
            getAvailableCountries();


        if (
            usedCountries.length >=
            available.length
        ) {

            nextButton.style.display =
                "none";

            finishLevel();

            return;

        }


        nextButton.style.display =
            "inline-block";


        updateProgress();


        return;

    }


    /* =========================
       НЕПРАВИЛЬНО
    ========================== */

    button.classList.add(
        "wrong"
    );


    buttons.forEach(
        btn => {

            if (
                btn.textContent ===
                currentCountry.name
            ) {

                btn.classList.add(
                    "correct"
                );

            }

        }
    );


    lives--;


    livesElement.textContent =
        lives;


    messageElement.textContent =
        "❌ Неправильно! Правильный ответ: " +
        currentCountry.name;


    messageElement.className =
        "message wrong-message";


    if (lives <= 0) {

        endGame();

    } else {

        /*
           Если жизни ещё есть,
           можно перейти дальше.
        */

        nextButton.style.display =
            "inline-block";

    }


    updateProgress();

}


/* =====================================================
   ОБНОВЛЕНИЕ РЕКОРДА
===================================================== */

function updateBestScore() {

    const record =
        getRecord(difficulty);


    if (score > record) {

        saveRecord(
            difficulty,
            score
        );


        recordElement.textContent =
            score;


        updateRecords();

    }

}


/* =====================================================
   ПРОГРЕСС
===================================================== */

function updateProgress() {

    const total =
        getAvailableCountries().length;


    const used =
        usedCountries.length;


    progressElement.textContent =
        getDifficultyName() +
        " • 🌍 Флагов: " +
        total +
        " • Показано: " +
        used +
        "/" +
        total;

}


/* =====================================================
   ЗАКОНЧИЛИСЬ ВСЕ ФЛАГИ
===================================================== */

function finishLevel() {

    gameRunning = false;

    questionAnswered = true;


    updateBestScore();


    messageElement.textContent =
        "🏆 Ты прошёл весь уровень! Результат: " +
        score +
        " очков";


    messageElement.className =
        "message win-message";


    nextButton.style.display =
        "none";


    startButton.textContent =
        "🔄 Играть ещё раз";


    document
        .querySelectorAll(".answer")
        .forEach(
            button => {
                button.disabled = true;
            }
        );


    updateProgress();

}


/* =====================================================
   КОНЕЦ ИГРЫ
===================================================== */

function endGame() {

    gameRunning = false;

    questionAnswered = true;


    updateBestScore();


    messageElement.textContent =
        "💥 Игра окончена! Твой результат: " +
        score +
        " очков";


    messageElement.className =
        "message wrong-message";


    nextButton.style.display =
        "none";


    startButton.textContent =
        "▶️ Начать игру";


    document
        .querySelectorAll(".answer")
        .forEach(
            button => {
                button.disabled = true;
            }
        );


    updateProgress();

}


/* =====================================================
   СБРОС
===================================================== */

function resetScreen() {

    score = 0;

    lives = 3;

    gameRunning = false;

    questionAnswered = false;

    currentCountry = null;

    /*
       Здесь начинается новый список.
       Старые флаги больше не учитываются.
    */

    usedCountries = [];


    scoreElement.textContent =
        "0";


    livesElement.textContent =
        "3";


    messageElement.textContent =
        "Нажми «Начать игру»";


    messageElement.className =
        "message";


    flagElement.removeAttribute(
        "src"
    );


    flagElement.alt =
        "Флаг";


    answersElement.innerHTML =
        "";


    nextButton.style.display =
        "none";


    startButton.textContent =
        "▶️ Начать игру";


    progressElement.textContent =
        "";


    updateRecords();

}


/* =====================================================
   ОШИБКА ЗАГРУЗКИ ФЛАГА
===================================================== */

flagElement.addEventListener(
    "error",
    function() {

        if (!currentCountry) {
            return;
        }


        messageElement.textContent =
            "⚠️ Не удалось загрузить флаг. Проверь подключение к интернету.";


        messageElement.className =
            "message wrong-message";

    }
);


/* =====================================================
   КЛАВИАТУРА
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            !gameRunning ||
            questionAnswered
        ) {
            return;
        }


        /*
           У нас всегда 4 ответа.
        */

        const keys = [
            "1",
            "2",
            "3",
            "4"
        ];


        if (
            !keys.includes(
                event.key
            )
        ) {
            return;
        }


        const index =
            Number(event.key) - 1;


        const buttons =
            document.querySelectorAll(
                ".answer"
            );


        if (buttons[index]) {

            buttons[index].click();

        }

    }
);


/* =====================================================
   ЗАПУСК
===================================================== */

updateDifficultyButtons();

updateRecords();

resetScreen();

</script>

</body>
</html>
